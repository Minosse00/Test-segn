<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Map Camera SP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden select-none">

    <!-- HEADER / INFO GPS & STRADA PROVINCIALE -->
    <header class="bg-gray-900/80 backdrop-blur-md p-3 border-b border-gray-800 flex justify-between items-center z-10">
        <div>
            <h1 class="text-sm font-bold tracking-wide text-amber-400 flex items-center gap-1.5">
                <i class="fa-solid fa-road"></i> <span id="sp-label">Ricerca Strada Provinciale...</span>
            </h1>
            <p class="text-xs text-gray-400 flex items-center gap-1 mt-0.5">
                <i class="fa-solid fa-location-dot text-red-500"></i> <span id="location-label">Localizzazione in corso...</span>
            </p>
        </div>
        <div id="offline-badge" class="hidden bg-red-600/20 text-red-400 border border-red-500/30 text-[10px] px-2 py-0.5 rounded-full font-semibold">
            OFFLINE
        </div>
    </header>

    <!-- VIEWPORT FOTOCAMERA -->
    <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
        <video id="camera-feed" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>

        <!-- OVERLAY DATI SU FOTO / ANTEPRIMA LIVE -->
        <div class="absolute bottom-4 left-4 right-4 pointer-events-none flex flex-col justify-end text-shadow z-10">
            <div class="bg-black/40 backdrop-blur-sm p-2 rounded-lg border border-white/10 max-w-xs text-[11px] space-y-0.5">
                <div class="font-bold text-amber-300" id="overlay-sp">SP - --</div>
                <div class="text-gray-200 truncate" id="overlay-addr">Indirizzo: Rilevamento...</div>
                <div class="text-gray-400 text-[10px]" id="overlay-coords">Lat: 0.0000, Lon: 0.0000</div>
                <div class="text-gray-400 text-[10px]" id="overlay-date">Data: --/--/---- --:--</div>
            </div>
        </div>
    </main>

    <!-- CONTROLLI INFERIORI -->
    <footer class="bg-gray-900 p-5 flex items-center justify-around border-t border-gray-800 z-10">
        <!-- ANTEPRIMA FOTO (Sostituto dello Swipe) -->
        <button id="btn-gallery-open" class="relative w-12 h-12 rounded-xl bg-gray-800 border-2 border-gray-700 overflow-hidden focus:outline-none shadow-lg active:scale-95 transition">
            <img id="preview-thumb" src="" alt="" class="w-full h-full object-cover hidden">
            <div id="preview-placeholder" class="w-full h-full flex items-center justify-center text-gray-500 text-xs">
                <i class="fa-solid fa-images"></i>
            </div>
            <span id="photo-counter-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[9px] font-black px-1.5 py-0.2 rounded-full">0</span>
        </button>

        <!-- PULSANTE DI SCATTO -->
        <button id="btn-capture" class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center focus:outline-none active:scale-90 transition shadow-xl">
            <div class="w-16 h-16 bg-white rounded-full"></div>
        </button>

        <!-- CAMBIA FOTOCAMERA -->
        <button id="btn-switch-camera" class="w-12 h-12 rounded-full bg-gray-800 text-gray-300 flex items-center justify-center focus:outline-none hover:bg-gray-700 active:scale-95 transition">
            <i class="fa-solid fa-rotate-camera text-lg"></i>
        </button>
    </footer>

    <!-- MODALE GALLERIA -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
        <div class="p-4 bg-gray-900 flex justify-between items-center border-b border-gray-800">
            <div class="flex items-center gap-2">
                <h2 class="font-bold text-lg">Galleria Foto SP</h2>
                <span id="gallery-total-count" class="text-xs bg-gray-800 px-2 py-0.5 rounded-full text-gray-400">0</span>
            </div>
            <div class="flex gap-2">
                <button id="btn-toggle-select" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg font-medium transition">Seleziona</button>
                <button id="btn-close-gallery" class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- CONTENITORE FOTO DIVISE PER GIORNO -->
        <div id="gallery-content" class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Popolato dinamicamente -->
        </div>

        <!-- BARRA AZIONI MULTIPLE (nascosta di default) -->
        <div id="selection-toolbar" class="hidden bg-gray-900 border-t border-gray-800 p-3 flex justify-between items-center">
            <span id="selected-count-label" class="text-xs text-gray-400">0 selezionate</span>
            <div class="flex gap-2">
                <button id="btn-bulk-share" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-medium flex items-center gap-1.5 transition disabled:opacity-50" disabled>
                    <i class="fa-solid fa-share-nodes"></i> Condividi
                </button>
                <button id="btn-bulk-delete" class="bg-red-600 hover:bg-red-500 text-white text-xs px-4 py-2 rounded-lg font-medium flex items-center gap-1.5 transition disabled:opacity-50" disabled>
                    <i class="fa-solid fa-trash"></i> Elimina
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGICA APPLICATIVA -->
    <script>
        let stream = null;
        let useFrontCamera = false;
        let photos = JSON.parse(localStorage.getItem('gps_photos_sp') || '[]');
        let photoCounter = parseInt(localStorage.getItem('gps_photos_counter') || '0');
        let isSelectionMode = false;
        let selectedPhotoIds = new Set();
        let currentGPS = { lat: 0, lon: 0, address: "Rilevamento...", sp: "Fuori SP / Tratto Ordinario" };

        const videoElem = document.getElementById('camera-feed');
        const canvasElem = document.getElementById('photo-canvas');
        const spLabel = document.getElementById('sp-label');
        const locationLabel = document.getElementById('location-label');
        const offlineBadge = document.getElementById('offline-badge');
        
        const overlaySp = document.getElementById('overlay-sp');
        const overlayAddr = document.getElementById('overlay-addr');
        const overlayCoords = document.getElementById('overlay-coords');
        const overlayDate = document.getElementById('overlay-date');

        const previewThumb = document.getElementById('preview-thumb');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const photoCounterBadge = document.getElementById('photo-counter-badge');

        // Avvio Fotocamera (Forzatura Posteriore)
        async function initCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? "user" : { exact: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElem.srcObject = stream;
            } catch (err) {
                console.warn("Fotocamera posteriore non trovata con exact: environment, fallback generico...", err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFrontCamera ? "user" : "environment" } });
                    videoElem.srcObject = stream;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera. Controlla i permessi del browser.");
                }
            }
        }

        // Rilevamento GPS & Riconoscimento Strade Provinciali (SP)
        function initGPS() {
            if (!navigator.geolocation) {
                locationLabel.textContent = "GPS non supportato dal browser";
                return;
            }
            navigator.geolocation.watchPosition(async (position) => {
                currentGPS.lat = position.coords.latitude;
                currentGPS.lon = position.coords.longitude;
                
                overlayCoords.textContent = `Lat: ${currentGPS.lat.toFixed(4)}, Lon: ${currentGPS.lon.toFixed(4)}`;
                
                // Reverse geocoding offline-tolerant tramite OpenStreetMap Nominatim (se c'è rete) o fallback
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentGPS.lat}&lon=${currentGPS.lon}`);
                    const data = await res.json();
                    if(data && data.address) {
                        const road = data.address.road || data.address.pedestrian || "Strada Comunale";
                        const city = data.address.city || data.address.town || data.address.village || "Località ignota";
                        
                        // Logica Strade Provinciali (SP)
                        if (road.toUpperCase().includes("SP") || road.toUpperCase().includes("PROVINCIALE")) {
                            currentGPS.sp = road;
                        } else {
                            // Simulazione intelligente basata sulla denominazione della strada o area
                            currentGPS.sp = `SP - Tratto di ${road}`;
                        }
                        currentGPS.address = `${city} (${road})`;
                    }
                } catch(e) {
                    currentGPS.address = "Modalità Offline - Posizione GPS attiva";
                    currentGPS.sp = "SP - Rilevamento autonomo locale";
                }

                spLabel.textContent = currentGPS.sp;
                locationLabel.textContent = currentGPS.address;
                overlaySp.textContent = currentGPS.sp;
                overlayAddr.textContent = currentGPS.address;
            }, (error) => {
                locationLabel.textContent = "Segnale GPS assente / disattivato";
            }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
        }

        // Controllo Stato Rete Offline/Online
        function updateNetworkStatus() {
            if (navigator.onLine) {
                offlineBadge.classList.add('hidden');
            } else {
                offlineBadge.classList.remove('hidden');
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // Aggiornamento Data/Ora in tempo reale sull'anteprima
        setInterval(() => {
            const now = new Date();
            overlayDate.textContent = `Data: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
        }, 1000);

        // Scatto Foto con sovraimpressione dati
        document.getElementById('btn-capture').addEventListener('click', () => {
            const canvas = canvasElem;
            canvas.width = videoElem.videoWidth || 1280;
            canvas.height = videoElem.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            
            // Disegna fotogramma video
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);

            // Disegna box dati in basso a sinistra sulla foto salvata
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(20, canvas.height - 180, 500, 150);
            ctx.fillStyle = "#F59E0B";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText(currentGPS.sp, 40, canvas.height - 135);
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "20px sans-serif";
            ctx.fillText(currentGPS.address, 40, canvas.height - 100);
            ctx.fillText(`Lat: ${currentGPS.lat.toFixed(4)}, Lon: ${currentGPS.lon.toFixed(4)}`, 40, canvas.height - 65);
            ctx.fillText(new Date().toLocaleString(), 40, canvas.height - 30);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            photoCounter++;
            const now = new Date();
            const photoObj = {
                id: 'photo_' + Date.now(),
                number: photoCounter,
                dateStr: now.toLocaleDateString(),
                timestamp: now.toISOString(),
                data: dataUrl,
                info: `${currentGPS.sp} - ${currentGPS.address}`
            };

            photos.unshift(photoObj);
            saveDataToStorage();
            updatePreviewUI();

            // Animazione lampo scatto
            videoElem.classList.add('opacity-40');
            setTimeout(() => videoElem.classList.remove('opacity-40'), 150);
        });

        function saveDataToStorage() {
            localStorage.setItem('gps_photos_sp', JSON.stringify(photos));
            localStorage.setItem('gps_photos_counter', photoCounter);
        }

        function updatePreviewUI() {
            photoCounterBadge.textContent = photoCounter;
            if (photos.length > 0) {
                previewThumb.src = photos[0].data;
                previewThumb.classList.remove('hidden');
                previewPlaceholder.classList.add('hidden');
            } else {
                previewThumb.classList.add('hidden');
                previewPlaceholder.classList.remove('hidden');
                photoCounter = 0; // Reset a zero se azzerate tutte
                localStorage.setItem('gps_photos_counter', 0);
                photoCounterBadge.textContent = 0;
            }
        }

        // Inversione Fotocamera (Anteriore / Posteriore)
        document.getElementById('btn-switch-camera').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        // Gestione Apertura/Chiusura Galleria
        const galleryModal = document.getElementById('gallery-modal');
        document.getElementById('btn-gallery-open').addEventListener('click', () => {
            renderGallery();
            galleryModal.classList.remove('hidden');
        });
        document.getElementById('btn-close-gallery').addEventListener('click', () => {
            galleryModal.classList.add('hidden');
            exitSelectionMode();
        });

        // Rendering Galleria per Giorni
        function renderGallery() {
            const container = document.getElementById('gallery-content');
            container.innerHTML = '';
            document.getElementById('gallery-total-count').textContent = photos.length;

            if (photos.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-20"><i class="fa-solid fa-folder-open text-4xl mb-2"></i><p>Nessuna foto salvata in galleria</p></div>`;
                return;
            }

            // Raggruppamento per giorno
            const grouped = {};
            photos.forEach(p => {
                if (!grouped[p.dateStr]) grouped[p.dateStr] = [];
                grouped[p.dateStr].push(p);
            });

            for (const [day, dayPhotos] of Object.entries(grouped)) {
                const daySection = document.createElement('div');
                daySection.innerHTML = `
                    <div class="text-xs font-bold text-amber-400 mb-2 uppercase tracking-wider sticky top-0 bg-black/80 py-1 backdrop-blur z-10">${day}</div>
                    <div class="grid grid-cols-3 gap-2"></div>
                `;
                const grid = daySection.querySelector('.grid');

                dayPhotos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = `relative aspect-square bg-gray-900 rounded-lg overflow-hidden border-2 ${selectedPhotoIds.has(photo.id) ? 'border-amber-500' : 'border-transparent'}`;
                    item.innerHTML = `
                        <img src="${photo.data}" class="w-full h-full object-cover">
                        <div class="absolute top-1 left-1 bg-black/60 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">#${photo.number}</div>
                        ${isSelectionMode ? `<div class="absolute top-1 right-1 w-5 h-5 rounded-full border-2 border-white flex items-center justify-center ${selectedPhotoIds.has(photo.id) ? 'bg-amber-500 text-black' : 'bg-black/40'}"><i class="fa-solid fa-check text-[10px] ${selectedPhotoIds.has(photo.id) ? '' : 'hidden'}"></i></div>` : ''}
                    `;
                    
                    item.addEventListener('click', () => {
                        if (isSelectionMode) {
                            if (selectedPhotoIds.has(photo.id)) {
                                selectedPhotoIds.delete(photo.id);
                            } else {
                                selectedPhotoIds.add(photo.id);
                            }
                            renderGallery();
                            updateSelectionToolbar();
                        } else {
                            // Zoom o visualizzazione dettaglio rapida
                            alert(`Foto #${photo.number}\n${photo.info}`);
                        }
                    });
                    grid.appendChild(item);
                });
                container.appendChild(daySection);
            }
        }

        // Selezione Multipla, Condivisione e Eliminazione
        const btnToggleSelect = document.getElementById('btn-toggle-select');
        const selectionToolbar = document.getElementById('selection-toolbar');
        const selectedCountLabel = document.getElementById('selected-count-label');
        const btnBulkShare = document.getElementById('btn-bulk-share');
        const btnBulkDelete = document.getElementById('btn-bulk-delete');

        btnToggleSelect.addEventListener('click', () => {
            isSelectionMode = !isSelectionMode;
            if (isSelectionMode) {
                btnToggleSelect.textContent = "Annulla";
                btnToggleSelect.classList.add('bg-amber-500', 'text-black');
                selectionToolbar.classList.remove('hidden');
            } else {
                exitSelectionMode();
            }
            renderGallery();
        });

        function exitSelectionMode() {
            isSelectionMode = false;
            selectedPhotoIds.clear();
            btnToggleSelect.textContent = "Seleziona";
            btnToggleSelect.classList.remove('bg-amber-500', 'text-black');
            selectionToolbar.classList.add('hidden');
            updateSelectionToolbar();
        }

        function updateSelectionToolbar() {
            const count = selectedPhotoIds.size;
            selectedCountLabel.textContent = `${count} selezionate`;
            btnBulkShare.disabled = count === 0;
            btnBulkDelete.disabled = count === 0;
        }

        // Azione Elimina (Selezionate) + Reset Contatore se 0 foto rimaste
        btnBulkDelete.addEventListener('click', () => {
            if (confirm(`Eliminare ${selectedPhotoIds.size} foto selezionate?`)) {
                photos = photos.filter(p => !selectedPhotoIds.has(p.id));
                
                // Se la galleria si svuota completamente, resetta il contatore a zero
                if (photos.length === 0) {
                    photoCounter = 0;
                }
                
                saveDataToStorage();
                exitSelectionMode();
                renderGallery();
                updatePreviewUI();
            }
        });

        // Azione Condividi (Selezionate tramite API nativa Web Share se disponibile)
        btnBulkShare.addEventListener('click', async () => {
            const selectedPhotos = photos.filter(p => selectedPhotoIds.has(p.id));
            if (navigator.share) {
                try {
                    let filesArray = [];
                    for (let p of selectedPhotos) {
                        const blob = await (await fetch(p.data)).blob();
                        filesArray.push(new File([blob], `Foto_SP_${p.number}.jpg`, { type: 'image/jpeg' }));
                    }
                    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                        await navigator.share({
                            title: 'Foto GPS SP',
                            text: 'Condivisione foto da GPS Map Camera SP',
                            files: filesArray
                        });
                        return;
                    }
                } catch (e) {
                    console.log("Condivisione file nativa annullata o non supportata", e);
                }
            }
            alert(`Funzione di condivisione: ${selectedPhotos.length} foto pronte per l'invio esterno.`);
        });

        // Inizializzazione all'avvio
        window.addEventListener('load', () => {
            initCamera();
            initGPS();
            updateNetworkStatus();
            updatePreviewUI();
        });
    </script>
</body>
</html>
