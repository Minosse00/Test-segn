<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPS Map Camera SP</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPS Camera">
    <meta name="theme-color" content="#030712">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="map.jpg">
    <link rel="apple-touch-icon" href="map.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LEAFLET CSS PER LA MAPPA VERA -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background-color: #030712; color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            position: fixed; touch-action: pan-y;
        }
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        /* Rimuovi i controlli di Leaflet dalla miniatura per renderla pulita */
        .leaflet-control-container { display: none !important; }
    </style>
</head>
<body class="flex flex-col select-none">

    <header class="w-full bg-gray-900/95 backdrop-blur-md px-3 py-2 border-b border-gray-800 flex justify-between items-center z-10 shrink-0 shadow-md">
        <div class="overflow-hidden pr-2 flex-1">
            <h1 class="text-xs font-bold tracking-wide text-amber-400 flex items-center gap-1.5 truncate">
                <i class="fa-solid fa-road text-[11px] shrink-0"></i> <span id="sp-label" class="truncate">Ricerca GPS...</span>
            </h1>
            <p class="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5 truncate">
                <i class="fa-solid fa-location-dot text-red-500 text-[10px] shrink-0"></i> <span id="location-label" class="truncate">Rilevamento in corso...</span>
            </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-install" class="hidden bg-blue-600 hover:bg-blue-500 text-white border border-blue-500 text-[10px] px-2 py-1 rounded-lg font-medium flex items-center gap-1 active:scale-95 transition">
                <i class="fa-solid fa-download"></i> Installa
            </button>
            <button id="btn-reset-counter" class="bg-gray-800 hover:bg-gray-700 text-amber-400 border border-gray-700 text-[10px] px-2 py-1 rounded-lg font-medium flex items-center gap-1 active:scale-95 transition">
                <i class="fa-solid fa-rotate-right"></i> Reset #
            </button>
        </div>
    </header>

    <main id="main-viewport" class="relative w-full flex-1 bg-black flex items-center justify-center overflow-hidden">
        <video id="camera-feed" autoplay playsinline class="absolute inset-0 w-full h-full object-cover transition-transform duration-300"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>

        <div class="absolute bottom-28 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 z-20 shadow-lg">
            <button class="zoom-btn w-9 h-9 rounded-full font-bold text-xs transition-colors bg-gray-700 text-white border border-gray-600 active:scale-90" data-zoom="0.6">0.6x</button>
            <button class="zoom-btn w-9 h-9 rounded-full font-bold text-xs transition-colors bg-amber-500 text-black border border-amber-400 active:scale-90" data-zoom="1">1x</button>
            <button class="zoom-btn w-9 h-9 rounded-full font-bold text-xs transition-colors bg-gray-700 text-white border border-gray-600 active:scale-90" data-zoom="2">2x</button>
        </div>

        <!-- BOX OVERLAY CON MINIATURA MAPPA REALE (LEAFLET) -->
        <div class="absolute bottom-3 left-3 right-3 pointer-events-none flex flex-col justify-end z-10">
            <div id="overlay-box" class="bg-black/85 backdrop-blur-md p-2.5 rounded-lg border border-white/15 max-w-[340px] shadow-2xl flex items-center gap-2.5 pointer-events-auto">
                <!-- Contenitore della vera mappa -->
                <div id="live-map-thumb" class="w-14 h-14 rounded bg-gray-800 border border-white/30 overflow-hidden shrink-0 z-0"></div>
                <div class="overflow-hidden space-y-0.5 flex-1 text-[10px]">
                    <div class="font-bold text-amber-300 truncate text-[11px]" id="overlay-category">Taglio erba</div>
                    <div class="text-white truncate font-bold" id="overlay-addr">Ricerca via e città in corso...</div>
                    <div class="text-gray-300 text-[9px]" id="overlay-coords">Lat: 0.0000, Lon: 0.0000</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full bg-gray-900 px-3 py-3 flex items-center justify-between border-t border-gray-800 z-10 shrink-0 gap-2 shadow-[0_-5px_15px_rgba(0,0,0,0.5)]">
        <button id="btn-exit" class="flex flex-col items-center justify-center bg-red-900/40 text-red-400 border border-red-800/50 rounded-xl w-12 h-12 shrink-0 active:scale-95 transition shadow-lg">
            <i class="fa-solid fa-power-off text-sm mb-0.5"></i>
            <span class="text-[8px] font-bold">ESCI</span>
        </button>

        <button id="btn-gallery-open" class="relative w-12 h-12 rounded-xl bg-gray-800 border-2 border-gray-700 overflow-hidden focus:outline-none shadow-lg active:scale-95 transition shrink-0 flex items-center justify-center">
            <img id="preview-thumb" src="" alt="" class="w-full h-full object-cover hidden">
            <div id="preview-placeholder" class="w-full h-full flex items-center justify-center text-gray-400 text-xs">
                <i class="fa-solid fa-images"></i>
            </div>
            <span id="photo-counter-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[9px] font-black px-1.5 py-0.5 rounded-full shadow-md">0</span>
        </button>

        <div class="flex items-center gap-2">
            <button id="btn-capture" class="w-16 h-16 rounded-full border-[3px] border-white flex items-center justify-center focus:outline-none active:scale-90 transition shadow-xl shrink-0 bg-gray-300/20">
                <div class="bg-white rounded-full w-[52px] h-[52px] shadow-sm"></div>
            </button>
            <label for="file-upload" class="w-10 h-10 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center text-white cursor-pointer active:scale-90 transition shadow-lg border border-gray-600">
                <i class="fa-solid fa-folder-open text-sm"></i>
            </label>
            <input type="file" id="file-upload" accept="image/*" class="hidden">
        </div>

        <div class="flex flex-col justify-center bg-gray-800/90 border border-gray-700 px-2.5 py-1.5 rounded-xl shrink-0 w-[105px] shadow-lg">
            <span class="text-[9px] text-gray-400 font-semibold mb-0.5 flex items-center gap-1">
                <i class="fa-solid fa-tag text-amber-400"></i> Categoria
            </span>
            <select id="category-select" class="w-full bg-gray-900 text-amber-300 text-[11px] font-bold rounded px-1 py-0.5 border border-gray-700 focus:outline-none focus:border-amber-500">
                <option value="Taglio erba" selected>Taglio erba</option>
                <option value="Buche">Buche</option>
                <option value="Segnaletica">Segnaletica</option>
                <option value="Altro">Altro</option>
            </select>
        </div>
    </footer>

    <!-- MODALE GALLERIA -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
        <div class="p-3 bg-gray-900 flex justify-between items-center border-b border-gray-800 shrink-0">
            <button id="btn-close-gallery" class="flex items-center gap-1 text-xs bg-gray-800 text-gray-200 px-3 py-1.5 rounded-lg font-medium border border-gray-700 active:scale-95 transition">
                <i class="fa-solid fa-arrow-left"></i> Indietro
            </button>
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-gray-300"><span id="gallery-total-count" class="text-amber-400">0</span> Foto</span>
            </div>
        </div>
        <div id="gallery-content" class="flex-1 overflow-y-auto p-3"></div>
    </div>

    <!-- MODALE AZIONE SINGOLA -->
    <div id="single-photo-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-xl max-w-sm w-full p-4 flex flex-col items-center shadow-2xl relative">
            <button id="btn-close-single" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center bg-gray-800 rounded-full text-gray-400 hover:text-white border border-gray-700 active:scale-90 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="single-photo-preview" src="" class="w-full max-h-72 object-contain rounded-lg mb-3 border border-gray-800 bg-black mt-4">
            <h3 id="single-photo-title" class="text-sm font-bold text-amber-400 mb-1">Foto</h3>
            <p id="single-photo-info" class="text-[10px] text-gray-300 text-center mb-4 w-full px-2 leading-tight"></p>
            <div class="flex gap-2 w-full">
                <button id="btn-single-share" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition active:scale-95 shadow-lg">
                    <i class="fa-solid fa-share-nodes text-sm"></i> Condividi
                </button>
                <button id="btn-single-delete" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-xs py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition active:scale-95 shadow-lg">
                    <i class="fa-solid fa-trash text-sm"></i> Elimina
                </button>
            </div>
        </div>
    </div>

    <!-- LEAFLET JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(console.error);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        let stream = null;
        let photos = JSON.parse(localStorage.getItem('gps_photos_pwa_v13') || '[]');
        let photoCounter = parseInt(localStorage.getItem('gps_photos_counter_pwa_v13') || '0');
        let currentGPS = { lat: 41.9028, lon: 12.4964 }; // Default Roma in attesa del GPS
        let currentAddressString = "Ricerca via e città in corso...";
        let lastGeocodeTime = 0;
        let currentActivePhotoId = null;
        let hardwareZoomSupported = false;

        const videoElem = document.getElementById('camera-feed');
        const canvasElem = document.getElementById('photo-canvas');
        const spLabel = document.getElementById('sp-label');
        const locationLabel = document.getElementById('location-label');
        const overlayAddr = document.getElementById('overlay-addr');
        const categorySelect = document.getElementById('category-select');
        const overlayCategory = document.getElementById('overlay-category');
        const overlayCoords = document.getElementById('overlay-coords');
        const fileUpload = document.getElementById('file-upload');

        // INIZIALIZZAZIONE MAPPA LEAFLET LIVE NELLA MINIATURA
        const liveMap = L.map('live-map-thumb', {
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false
        }).setView([currentGPS.lat, currentGPS.lon], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(liveMap);

        const liveMarker = L.marker([currentGPS.lat, currentGPS.lon]).addTo(liveMap);

        function playShutterSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        const zoomBtns = document.querySelectorAll('.zoom-btn');
        zoomBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const zoomVal = parseFloat(btn.dataset.zoom);
                zoomBtns.forEach(b => {
                    b.classList.remove('bg-amber-500', 'text-black', 'border-amber-400');
                    b.classList.add('bg-gray-700', 'text-white', 'border-gray-600');
                });
                btn.classList.remove('bg-gray-700', 'text-white', 'border-gray-600');
                btn.classList.add('bg-amber-500', 'text-black', 'border-amber-400');
                applyZoom(zoomVal);
            });
        });

        function applyZoom(val) {
            if (!stream) return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            if (capabilities.zoom) {
                hardwareZoomSupported = true;
                let minZ = capabilities.zoom.min || 1;
                let maxZ = capabilities.zoom.max || 2;
                let finalZoom = val;
                if (val === 0.6) finalZoom = minZ; 
                if (finalZoom > maxZ) finalZoom = maxZ;

                track.applyConstraints({ advanced: [{ zoom: finalZoom }] }).catch(e => {});
            } else {
                hardwareZoomSupported = false;
                videoElem.style.transform = val >= 1 ? `scale(${val})` : `scale(1)`;
            }
        }

        async function initCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                videoElem.srcObject = stream;
            } catch (err) {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                videoElem.srcObject = stream;
            }
        }

        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async (position) => {
                    currentGPS.lat = position.coords.latitude;
                    currentGPS.lon = position.coords.longitude;
                    const coordStr = `Lat: ${currentGPS.lat.toFixed(5)}, Lon: ${currentGPS.lon.toFixed(5)}`;
                    
                    locationLabel.textContent = coordStr;
                    overlayCoords.textContent = coordStr;
                    
                    // Aggiorna la posizione della mappa Leaflet in tempo reale
                    liveMap.setView([currentGPS.lat, currentGPS.lon], 16);
                    liveMarker.setLatLng([currentGPS.lat, currentGPS.lon]);
                    setTimeout(() => liveMap.invalidateSize(), 100);

                    const now = Date.now();
                    if (now - lastGeocodeTime > 7000) { 
                        lastGeocodeTime = now;
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentGPS.lat}&lon=${currentGPS.lon}&zoom=18&addressdetails=1&_=${now}`);
                            const data = await response.json();
                            
                            if (data && data.address) {
                                let road = data.address.road || data.address.pedestrian || "";
                                let city = data.address.city || data.address.town || data.address.village || "";
                                let spFound = road.toUpperCase().includes("SP") || road.toUpperCase().includes("STRADA PROVINCIALE");

                                currentAddressString = (road || city) ? `${road}${road && city ? ', ' : ''}${city}` : "Indirizzo non mappato";
                                
                                if (spFound) {
                                    spLabel.innerHTML = `GPS Attivo <span class="bg-amber-500 text-black px-1.5 py-0.5 rounded text-[9px] ml-1 uppercase shadow-sm">SP</span>`;
                                } else {
                                    spLabel.textContent = "GPS Attivo";
                                }

                                overlayAddr.textContent = currentAddressString;
                            }
                        } catch (error) {
                            console.error("Geocoding in attesa...");
                        }
                    }
                }, null, { enableHighAccuracy: true });
            }
        }

        categorySelect.addEventListener('change', () => overlayCategory.textContent = categorySelect.value);

        function drawGPSOverlay(canvas, ctx, callback) {
            const panelH = Math.max(160, canvas.height * 0.18); 
            const panelY = canvas.height - panelH;
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, panelY, canvas.width, panelH);
            ctx.fillStyle = "rgba(255, 152, 0, 0.9)";
            ctx.fillRect(0, panelY, 15, panelH);

            const mapSize = panelH * 0.8; 
            const mapX = 30;
            const mapY = panelY + (panelH - mapSize) / 2;

            // Disegna un riquadro grafico pulito per la mappa sulla foto salvata
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(mapX, mapY, mapSize, mapSize);
            ctx.strokeStyle = "white";
            ctx.lineWidth = 4;
            ctx.strokeRect(mapX, mapY, mapSize, mapSize);

            // Simbolo pin e coordinate al centro del riquadro mappa sulla foto
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(mapX + mapSize / 2, mapY + mapSize / 2, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            const textX = mapX + mapSize + 30;
            const baseFontSize = Math.max(16, canvas.width * 0.024);
            const now = new Date();
            
            ctx.fillStyle = "white";
            ctx.font = `bold ${baseFontSize * 1.3}px sans-serif`;
            ctx.fillText(currentAddressString, textX, mapY + (mapSize * 0.25));
            
            ctx.font = `${baseFontSize}px monospace`;
            ctx.fillStyle = "#e2e8f0";
            ctx.fillText(`Lat: ${currentGPS.lat.toFixed(6)} | Lon: ${currentGPS.lon.toFixed(6)}`, textX, mapY + (mapSize * 0.50));
            
            ctx.fillStyle = "#fbbf24";
            ctx.font = `bold ${baseFontSize * 0.9}px sans-serif`;
            ctx.fillText(`Data: ${now.toLocaleDateString()}  Ora: ${now.toLocaleTimeString()}`, textX, mapY + (mapSize * 0.75));
            
            ctx.fillStyle = "#94a3b8";
            ctx.font = `bold ${baseFontSize * 0.9}px sans-serif`;
            ctx.fillText(`Cat: ${categorySelect.value}  |  Rif: #${photoCounter + 1}`, textX, mapY + (mapSize * 0.95));
            
            callback();
        }

        function finalizePhoto(canvas) {
            photoCounter++;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const now = new Date();
            
            photos.unshift({
                id: 'photo_' + Date.now(),
                number: photoCounter,
                category: categorySelect.value,
                dateStr: now.toLocaleDateString(),
                timestamp: now.toISOString(),
                data: dataUrl,
                info: `${currentAddressString} \nLat: ${currentGPS.lat.toFixed(5)}, Lon: ${currentGPS.lon.toFixed(5)}`
            });
            
            localStorage.setItem('gps_photos_pwa_v13', JSON.stringify(photos));
            localStorage.setItem('gps_photos_counter_pwa_v13', photoCounter);
            updatePreviewUI();
        }

        document.getElementById('btn-capture').addEventListener('click', () => {
            playShutterSound();
            const canvas = canvasElem;
            canvas.width = videoElem.videoWidth || 1920;
            canvas.height = videoElem.videoHeight || 1080;
            const ctx = canvas.getContext('2d');
            
            if (!hardwareZoomSupported) {
                const scale = parseFloat(document.querySelector('.zoom-btn.bg-amber-500').dataset.zoom) || 1;
                if (scale > 1) {
                    ctx.scale(scale, scale);
                    ctx.translate(-canvas.width * (scale - 1) / (2 * scale), -canvas.height * (scale - 1) / (2 * scale));
                }
            }
            
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            if (!hardwareZoomSupported) ctx.resetTransform();
            
            videoElem.classList.add('opacity-40');
            setTimeout(() => videoElem.classList.remove('opacity-40'), 150);

            drawGPSOverlay(canvas, ctx, () => finalizePhoto(canvas));
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            playShutterSound();
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = canvasElem;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    drawGPSOverlay(canvas, ctx, () => {
                        finalizePhoto(canvas);
                        alert("Foto importata e geolocalizzata con successo!");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function updatePreviewUI() {
            document.getElementById('photo-counter-badge').textContent = photoCounter;
            const thumb = document.getElementById('preview-thumb');
            const placeholder = document.getElementById('preview-placeholder');
            if (photos.length > 0) {
                thumb.src = photos[0].data;
                thumb.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                thumb.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        function recalculateCounter() {
            photoCounter = photos.length === 0 ? 0 : Math.max(...photos.map(p => p.number));
            localStorage.setItem('gps_photos_counter_pwa_v13', photoCounter);
        }

        document.getElementById('btn-reset-counter').addEventListener('click', () => {
            if (confirm("Azzerare la numerazione delle foto?")) { 
                photoCounter = 0; 
                localStorage.setItem('gps_photos_counter_pwa_v13', 0); 
                updatePreviewUI(); 
            }
        });
        
        document.getElementById('btn-exit').addEventListener('click', () => { 
            if(confirm("Chiudere l'app?")) window.close(); 
        });

        const galleryModal = document.getElementById('gallery-modal');
        document.getElementById('btn-gallery-open').addEventListener('click', () => { 
            renderGallery(); 
            galleryModal.classList.remove('hidden'); 
        });
        
        document.getElementById('btn-close-gallery').addEventListener('click', () => { 
            galleryModal.classList.add('hidden'); 
        });
        
        document.getElementById('btn-close-single').addEventListener('click', () => {
            document.getElementById('single-photo-modal').classList.add('hidden')
        });

        document.getElementById('btn-single-delete').addEventListener('click', () => {
            if(confirm("Sei sicuro di voler eliminare questa foto?")) {
                photos = photos.filter(p => p.id !== currentActivePhotoId);
                recalculateCounter();
                localStorage.setItem('gps_photos_pwa_v13', JSON.stringify(photos));
                document.getElementById('single-photo-modal').classList.add('hidden');
                renderGallery();
                updatePreviewUI();
            }
        });

        document.getElementById('btn-single-share').addEventListener('click', async () => {
            const photo = photos.find(p => p.id === currentActivePhotoId);
            if (!photo) return;
            if (navigator.share) {
                try {
                    const blob = await (await fetch(photo.data)).blob();
                    const file = new File([blob], `Foto_GPS_${photo.number}.jpg`, { type: 'image/jpeg' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: `Foto GPS #${photo.number}` });
                    }
                } catch (e) {}
            } else {
                alert("Condivisione nativa non supportata dal browser.");
            }
        });

        function renderGallery() {
            const container = document.getElementById('gallery-content');
            container.innerHTML = '';
            document.getElementById('gallery-total-count').textContent = photos.length;
            
            if (photos.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-16"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><br>Nessuna foto salvata</div>`;
                return;
            }

            const grouped = {};
            photos.forEach(photo => {
                if (!grouped[photo.dateStr]) grouped[photo.dateStr] = [];
                grouped[photo.dateStr].push(photo);
            });

            for (const date in grouped) {
                const dateHeader = document.createElement('div');
                dateHeader.className = "text-amber-500 font-bold text-xs mt-4 mb-2 border-b border-gray-800 pb-1 sticky top-0 bg-gray-900/95 backdrop-blur z-10 px-1";
                dateHeader.textContent = date;
                container.appendChild(dateHeader);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-3 gap-1.5";

                grouped[date].forEach(photo => {
                    const item = document.createElement('div');
                    item.className = `relative aspect-square bg-gray-800 rounded-lg overflow-hidden border border-gray-700 active:scale-95 transition-transform`;
                    item.innerHTML = `
                        <img src="${photo.data}" class="w-full h-full object-cover">
                        <div class="absolute top-1 left-1 bg-black/80 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow-md">#${photo.number}</div>
                    `;
                    item.addEventListener('click', () => {
                        currentActivePhotoId = photo.id;
                        document.getElementById('single-photo-preview').src = photo.data;
                        document.getElementById('single-photo-title').textContent = `Foto #${photo.number}`;
                        document.getElementById('single-photo-info').innerText = photo.info;
                        document.getElementById('single-photo-modal').classList.remove('hidden');
                    });
                    grid.appendChild(item);
                });
                container.appendChild(grid);
            }
        }

        window.onload = () => { 
            initCamera(); 
            initGPS(); 
            updatePreviewUI();
            setTimeout(() => { liveMap.invalidateSize(); }, 300);
        };
    </script>
</body>
</html>
