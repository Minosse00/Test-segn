<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Map Camera - Segnalazioni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.hidden-input { display: none; }</style>
</head>
<body class="bg-gray-900 font-sans antialiased pb-10 text-white" onload="ottieniPosizione()">

    <div id="status-rete" class="bg-green-600 text-white text-xs font-bold text-center py-1 transition-all">
        Connesso a Internet
    </div>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- AREA FOTOCAMERA / INTERFACCIA GPS MAP CAMERA -->
        <div class="bg-gray-800 rounded-2xl p-4 shadow-xl border border-gray-700 space-y-4">
            
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-600 rounded-xl overflow-hidden bg-gray-950 aspect-video relative">
                <!-- Input Fotocamera Diretto (Compatibile Android & iOS) -->
                <input type="file" accept="image/*" capture="environment" id="camera-input" class="hidden-input" onchange="previewImage(event)">
                
                <div id="upload-placeholder" class="text-center p-4 w-full">
                    <p class="text-xs text-gray-400 mb-3 font-bold uppercase tracking-wider">Pronto per lo scatto</p>
                    <button type="button" onclick="document.getElementById('camera-input').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2 shadow-lg mx-auto">
                        📸 Scatta Foto GPS
                    </button>
                </div>
                
                <!-- Contenitore Immagine con Template GPS Map Camera Sovrapposto -->
                <div id="preview-container" class="hidden absolute inset-0 w-full h-full">
                    <img id="preview" class="w-full h-full object-cover cursor-pointer" alt="Anteprima" onclick="document.getElementById('camera-input').click()">
                    
                    <!-- Overlay stile GPS Map Camera -->
                    <div class="absolute bottom-0 left-0 right-0 bg-black/80 p-2.5 flex items-center gap-2.5 border-t border-blue-500/50 backdrop-blur-sm pointer-events-none">
                        <div class="w-12 h-12 bg-slate-900 border-2 border-blue-500 rounded flex items-center justify-center text-lg flex-shrink-0 shadow">
                            📍
                        </div>
                        <div class="text-[10px] leading-tight text-white space-y-0.5 overflow-hidden">
                            <p id="overlay-citta" class="font-bold text-blue-400 truncate uppercase">Località in corso...</p>
                            <p id="overlay-indirizzo" class="text-gray-200 truncate">Indirizzo...</p>
                            <p id="overlay-coords" class="text-gray-300 font-mono">Lat: 0.0000 | Long: 0.0000</p>
                            <p id="overlay-data" class="text-yellow-400 font-semibold">Data e Ora</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONTROLLI: RISOLUZIONE E CATEGORIA -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Risoluzione Foto</label>
                    <select id="risoluzione" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-xl text-sm outline-none text-white">
                        <option value="1280">Media (1280px)</option>
                        <option value="1920" selected>Alta (Full HD)</option>
                        <option value="originale">Originale (Massima)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Tipo Problema</label>
                    <select id="categoria" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-xl text-sm outline-none text-white" onchange="aggiornaOverlayDime()">
                        <option value="🕳️ Buca stradale">🕳️ Buche</option>
                        <option value="🌱 Taglio erba">🌱 Taglio Erba</option>
                        <option value="🛑 Segnaletica">🛑 Segnaletica</option>
                        <option value="⚙️ Altro">⚙️ Altro</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Posizione GPS</label>
                    <button type="button" onclick="ottieniPosizione()" class="w-full bg-blue-600 hover:bg-blue-700 p-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                        📍 <span id="gps-btn-text">Aggiorna GPS</span>
                    </button>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Note (opzionale)</label>
                    <input type="text" id="note" oninput="aggiornaOverlayDime()" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-xl text-sm outline-none text-white" placeholder="Es. civico 4...">
                </div>
            </div>
            
            <p id="gps-status" class="text-[11px] text-gray-300 font-mono text-center truncate bg-gray-900 p-2 rounded border border-gray-700">Rilevamento GPS automatico...</p>

            <!-- PULSANTE SALVATAGGIO MAPCAMERA -->
            <div class="pt-2">
                <button onclick="salvaFotoMapCamera()" class="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-bold text-center shadow-lg hover:bg-emerald-500 transition flex items-center justify-center gap-2">
                    💾 Salva in MapCamera
                </button>
            </div>
        </div>

        <!-- STORICO LOCALE -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-gray-400 tracking-wider uppercase">Archivio MapCamera</h2>
                <button onclick="svuotaArchivio()" class="text-xs text-red-400 hover:text-red-300 underline">Elimina Tutti</button>
            </div>
            <div id="lista-segnalazioni" class="space-y-3"></div>
        </div>
    </main>

    <script>
        let coordinateAttuali = { lat: "0.000000", lng: "0.000000", citta: "Sconosciuta", indirizzo: "Posizione non rilevata", dataOra: "" };
        let fileSelezionato = null;
        let dirHandleMapCamera = null;

        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        function aggiornaStatoRete() {
            const bar = document.getElementById('status-rete');
            if (bar) {
                if (navigator.onLine) {
                    bar.innerText = "Connesso a Internet";
                    bar.className = "bg-green-600 text-white text-xs font-bold text-center py-1";
                } else {
                    bar.innerText = "Modalità Offline";
                    bar.className = "bg-orange-600 text-white text-xs font-bold text-center py-1";
                }
            }
        }
        window.addEventListener('online', aggiornaStatoRete);
        window.addEventListener('offline', aggiornaStatoRete);

        function aggiornaOverlayDime() {
            document.getElementById('overlay-citta').innerText = coordinateAttuali.citta.toUpperCase();
            document.getElementById('overlay-indirizzo').innerText = coordinateAttuali.indirizzo;
            document.getElementById('overlay-coords').innerText = `Lat: ${coordinateAttuali.lat} | Long: ${coordinateAttuali.lng}`;
            const cat = document.getElementById('categoria').value;
            const note = document.getElementById('note').value;
            let testoData = `${coordinateAttuali.dataOra} - ${cat}`;
            if(note) testoData += ` | Note: ${note}`;
            document.getElementById('overlay-data').innerText = testoData;
        }

        function previewImage(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            fileSelezionato = files[0];

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview-container').classList.remove('hidden');
                document.getElementById('upload-placeholder').classList.add('hidden');
                aggiornaOverlayDime();
            }
            reader.readAsDataURL(fileSelezionato);
        }

        function ottieniPosizione() {
            const status = document.getElementById('gps-status');
            const btnText = document.getElementById('gps-btn-text');
            if (!navigator.geolocation) { status.innerText = "GPS non supportato"; return; }
            
            btnText.innerText = "Ricerca...";
            status.innerText = "Rilevamento posizione in corso...";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const now = new Date();
                    const dataOra = `${now.toLocaleDateString('it-IT')} ${now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'})}`;
                    
                    coordinateAttuali = { lat, lng, citta: "Località rilevata", indirizzo: `Lat: ${lat}, Lng: ${lng}`, dataOra };

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                            headers: { 'User-Agent': 'MapCameraApp/1.0' }
                        });
                        const data = await response.json();
                        if (data && data.address) {
                            const addr = data.address;
                            const localita = addr.city || addr.town || addr.village || addr.municipality || "Zona Rurale";
                            const nazione = addr.country || "Italia";
                            let strada = addr.road || addr.pedestrian || addr.suburb || "Indirizzo non specificato";

                            coordinateAttuali.citta = `${localita}, ${nazione}`;
                            coordinateAttuali.indirizzo = strada;
                        }
                    } catch (e) {}

                    btnText.innerText = "Rilevato ✓";
                    status.innerText = `📍 ${coordinateAttuali.citta} - ${coordinateAttuali.indirizzo}`;
                    aggiornaOverlayDime();
                },
                (error) => {
                    btnText.innerText = "Rileva GPS";
                    status.innerText = "Errore GPS: Attiva la localizzazione.";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function elaboraERidimensionaImmagine(file, maxDim, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let w = img.width;
                    let h = img.height;

                    if (maxDim !== 'originale') {
                        const targetMax = parseInt(maxDim);
                        if (w > h && w > targetMax) {
                            h = Math.round((h * targetMax) / w);
                            w = targetMax;
                        } else if (h >= w && h > targetMax) {
                            w = Math.round((w * targetMax) / h);
                            h = targetMax;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    // Applicazione Watermark GPS Map Camera sulla foto ridimensionata
                    const cardHeight = Math.floor(canvas.height * 0.22);
                    const cardY = canvas.height - cardHeight;
                    const padding = Math.floor(cardHeight * 0.08);

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.fillRect(0, cardY, canvas.width, cardHeight);

                    const mapWidth = Math.floor(cardHeight * 0.85);
                    const mapHeight = Math.floor(cardHeight * 0.84);
                    const mapX = padding;
                    const mapY = cardY + padding;

                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(mapX, mapY, mapWidth, mapHeight);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(mapX, mapY, mapWidth, mapHeight);

                    ctx.font = `${Math.floor(mapHeight * 0.4)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📍', mapX + (mapWidth / 2), mapY + (mapHeight / 2));

                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    const textX = mapX + mapWidth + padding;
                    let currentY = mapY;
                    const lineSpacing = Math.floor(cardHeight * 0.14);

                    ctx.font = `bold ${Math.floor(cardHeight * 0.12)}px Arial`;
                    ctx.fillStyle = '#60a5fa';
                    ctx.fillText(coordinateAttuali.citta.toUpperCase(), textX, currentY);

                    currentY += lineSpacing;
                    ctx.font = `${Math.floor(cardHeight * 0.10)}px Arial`;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(coordinateAttuali.indirizzo, textX, currentY);

                    currentY += lineSpacing;
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillText(`Lat: ${coordinateAttuali.lat} | Long: ${coordinateAttuali.lng}`, textX, currentY);

                    currentY += lineSpacing;
                    ctx.fillStyle = '#facc15';
                    const categoria = document.getElementById('categoria').value;
                    const noteText = document.getElementById('note').value;
                    let idFormattato = document.getElementById('temp-id-progressivo').value;
                    ctx.fillText(`${coordinateAttuali.dataOra} - ${idFormattato} ${categoria}`, textX, currentY);

                    if (noteText) {
                        currentY += lineSpacing;
                        ctx.fillStyle = '#9ca3af';
                        ctx.fillText(`Note: ${noteText}`, textX, currentY);
                    }

                    callback(canvas.toDataURL('image/jpeg', 0.90));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function scaricaInCartellaMapCamera(blob, filename) {
            // Supporto moderni browser Android/Desktop
            if ('showDirectoryPicker' in window) {
                try {
                    if (!dirHandleMapCamera) {
                        dirHandleMapCamera = await window.showDirectoryPicker();
                    }
                    const newFileHandle = await dirHandleMapCamera.getFileHandle(filename, { create: true });
                    const writable = await newFileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return;
                } catch (err) {
                    console.log("Scelta cartella manuale saltata, uso download standard.");
                }
            }

            // Metodo universale compatibile con iOS (Safari) e Android
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function salvaFotoMapCamera() {
            if (!fileSelezionato) { alert("Scatta prima una foto!"); return; }

            let numeroProgressivo = parseInt(localStorage.getItem('counter_mapcamera') || '0') + 1;
            localStorage.setItem('counter_mapcamera', numeroProgressivo);
            const idFormattato = `#${String(numeroProgressivo).padStart(3, '0')}`;

            // Elemento nascosto per passare l'ID corrente alla funzione di disegno
            let tempInput = document.getElementById('temp-id-progressivo');
            if(!tempInput) {
                tempInput = document.createElement('input');
                tempInput.type = 'hidden';
                tempInput.id = 'temp-id-progressivo';
                document.body.appendChild(tempInput);
            }
            tempInput.value = idFormattato;

            const risoluzioneScelta = document.getElementById('risoluzione').value;

            elaboraERidimensionaImmagine(fileSelezionato, risoluzioneScelta, async function(fotoWatermarked) {
                const blob = dataURLtoBlob(fotoWatermarked);
                const filename = `MapCamera_${idFormattato.replace('#','')}.jpg`;

                await scaricaInCartellaMapCamera(blob, filename);

                const nuovaSegnalazione = {
                    id: Date.now(),
                    progressivo: idFormattato,
                    categoria: document.getElementById('categoria').value,
                    note: document.getElementById('note').value,
                    luogo: `${coordinateAttuali.citta} - ${coordinateAttuali.indirizzo}`,
                    foto: fotoWatermarked,
                    data: coordinateAttuali.dataOra,
                    filename: filename
                };

                let archivio = JSON.parse(localStorage.getItem('archivio_mapcamera')) || [];
                archivio.unshift(nuovaSegnalazione);
                localStorage.setItem('archivio_mapcamera', JSON.stringify(archivio));
                mostraSegnalazioni();
                resetForm();
                alert("Foto salvata con successo!");
            });
        }

        function scaricaSingola(id) {
            let archivio = JSON.parse(localStorage.getItem('archivio_mapcamera')) || [];
            let item = archivio.find(s => s.id === id);
            if (!item) return;

            const blob = dataURLtoBlob(item.foto);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = item.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function eliminaSegnalazione(id) {
            if (!confirm("Vuoi eliminare questa foto dall'archivio?")) return;
            let archivio = JSON.parse(localStorage.getItem('archivio_mapcamera')) || [];
            archivio = archivio.filter(s => s.id !== id);
            localStorage.setItem('archivio_mapcamera', JSON.stringify(archivio));
            mostraSegnalazioni();
        }

        function svuotaArchivio() {
            if (!confirm("Vuoi svuotare tutto l'archivio MapCamera?")) return;
            localStorage.removeItem('archivio_mapcamera');
            mostraSegnalazioni();
        }

        function resetForm() {
            document.getElementById('note').value = "";
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            fileSelezionato = null;
        }

        function mostraSegnalazioni() {
            const lista = document.getElementById('lista-segnalazioni');
            if (!lista) return;
            const archivio = JSON.parse(localStorage.getItem('archivio_mapcamera')) || [];
            
            lista.innerHTML = "";
            if (archivio.length === 0) {
                lista.innerHTML = `<p class="text-xs text-gray-500 text-center py-4 bg-gray-800 rounded-xl border border-gray-800">Nessuna foto salvata</p>`;
                return;
            }

            archivio.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-gray-800 p-3 rounded-xl border border-gray-700 space-y-2 flex items-center gap-3";
                div.innerHTML = `
                    <img src="${item.foto}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0 border border-gray-600">
                    <div class="text-xs space-y-1 overflow-hidden w-full">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-yellow-400">${item.progressivo} - ${item.categoria}</span>
                            <span class="text-gray-400 text-[10px]">${item.data}</span>
                        </div>
                        <p class="text-blue-300 truncate">📍 ${item.luogo || 'Posizione non specificata'}</p>
                        <p class="text-gray-400 truncate">Note: ${item.note || 'Nessuna'}</p>
                        <div class="flex gap-2 pt-1 justify-end">
                            <button onclick="scaricaSingola(${item.id})" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold px-2.5 py-1 rounded transition">
                                📥 Scarica di nuovo
                            </button>
                            <button onclick="eliminaSegnalazione(${item.id})" class="bg-red-600 hover:bg-red-500 text-white text-[10px] font-bold px-2.5 py-1 rounded transition">
                                🗑️ Elimina
                            </button>
                        </div>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        document.addEventListener('DOMContentLoaded', mostraSegnalazioni);
    </script>
</body>
</html>
