<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPS Map Camera SP</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPS Camera">
    <meta name="theme-color" content="#030712">

    <!-- Richiamo al Manifest separato -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="map.jpg">
    <link rel="apple-touch-icon" href="map.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background-color: #030712; color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            position: fixed; touch-action: pan-y;
        }
        * { box-sizing: border-box; }
    </style>
</head>
<body class="flex flex-col select-none">

    <header class="w-full bg-gray-900/95 backdrop-blur-md px-3 py-2 border-b border-gray-800 flex justify-between items-center z-10 shrink-0">
        <div class="overflow-hidden pr-2 flex-1">
            <h1 class="text-xs font-bold tracking-wide text-amber-400 flex items-center gap-1.5 truncate">
                <i class="fa-solid fa-road text-[11px] shrink-0"></i> <span id="sp-label" class="truncate">Ricerca GPS...</span>
            </h1>
            <p class="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5 truncate">
                <i class="fa-solid fa-location-dot text-red-500 text-[10px] shrink-0"></i> <span id="location-label" class="truncate">Rilevamento in corso...</span>
            </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-install" class="hidden bg-blue-600 hover:bg-blue-500 text-white border border-blue-500 text-[10px] px-2 py-1 rounded-lg font-medium flex items-center gap-1 active:scale-95 transition">
                <i class="fa-solid fa-download"></i> Installa App
            </button>
            <button id="btn-reset-counter" class="bg-gray-800 hover:bg-gray-700 text-amber-400 border border-gray-700 text-[10px] px-2 py-1 rounded-lg font-medium flex items-center gap-1 active:scale-95 transition">
                <i class="fa-solid fa-rotate-right"></i> Reset #
            </button>
        </div>
    </header>

    <main id="main-viewport" class="relative w-full flex-1 bg-black flex items-center justify-center overflow-hidden">
        <video id="camera-feed" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>

        <div class="absolute bottom-3 left-3 right-3 pointer-events-none flex flex-col justify-end z-10">
            <div id="overlay-box" class="bg-black/65 backdrop-blur-md p-2 rounded-lg border border-white/15 max-w-[280px] text-[10px] space-y-0.5 shadow-lg">
                <div class="font-bold text-amber-300 truncate" id="overlay-category">Taglio erba</div>
                <div class="text-gray-100 truncate font-semibold text-green-400" id="overlay-addr">Posizione: In attesa...</div>
                <div class="text-gray-300 text-[9px]" id="overlay-coords">Lat: 0.0000, Lon: 0.0000</div>
            </div>
        </div>
    </main>

    <footer class="w-full bg-gray-900 px-3 py-3 flex items-center justify-between border-t border-gray-800 z-10 shrink-0 gap-2">
        <button id="btn-exit" class="flex flex-col items-center justify-center bg-red-900/40 text-red-400 border border-red-800/50 rounded-xl w-12 h-12 shrink-0 active:scale-95 transition shadow-lg">
            <i class="fa-solid fa-power-off text-sm mb-0.5"></i>
            <span class="text-[8px] font-bold">ESCI</span>
        </button>

        <button id="btn-gallery-open" class="relative w-12 h-12 rounded-xl bg-gray-800 border-2 border-gray-700 overflow-hidden focus:outline-none shadow-lg active:scale-95 transition shrink-0 flex items-center justify-center">
            <img id="preview-thumb" src="" alt="" class="w-full h-full object-cover hidden">
            <div id="preview-placeholder" class="w-full h-full flex items-center justify-center text-gray-400 text-xs">
                <i class="fa-solid fa-images"></i>
            </div>
            <span id="photo-counter-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[9px] font-black px-1.5 py-0.2 rounded-full">0</span>
        </button>

        <div class="flex items-center gap-2">
            <button id="btn-capture" class="w-14 h-14 rounded-full border-3 border-white flex items-center justify-center focus:outline-none active:scale-90 transition shadow-xl shrink-0">
                <div class="bg-white rounded-full w-[46px] h-[46px]"></div>
            </button>
            <label for="file-upload" class="w-10 h-10 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center text-white cursor-pointer active:scale-90 transition shadow-lg border border-gray-600">
                <i class="fa-solid fa-folder-open text-sm"></i>
            </label>
            <input type="file" id="file-upload" accept="image/*" class="hidden">
        </div>

        <div class="flex flex-col justify-center bg-gray-800/90 border border-gray-700 px-2.5 py-1.5 rounded-xl shrink-0 w-[100px] shadow-lg">
            <span class="text-[9px] text-gray-400 font-semibold mb-0.5 flex items-center gap-1">
                <i class="fa-solid fa-tag text-amber-400"></i> Categoria
            </span>
            <select id="category-select" class="w-full bg-gray-900 text-amber-300 text-[11px] font-bold rounded px-1 py-0.5 border border-gray-700 focus:outline-none focus:border-amber-500">
                <option value="Taglio erba" selected>Taglio erba</option>
                <option value="Buche">Buche</option>
                <option value="Segnaletica">Segnaletica</option>
                <option value="Altro">Altro</option>
            </select>
        </div>
    </footer>

    <!-- MODALE GALLERIA -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
        <div class="p-3 bg-gray-900 flex justify-between items-center border-b border-gray-800 shrink-0">
            <button id="btn-close-gallery" class="flex items-center gap-1 text-xs bg-gray-800 text-gray-200 px-3 py-1.5 rounded-lg font-medium border border-gray-700">
                <i class="fa-solid fa-arrow-left"></i> Indietro
            </button>
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-gray-300"><span id="gallery-total-count" class="text-amber-400">0</span> Foto</span>
                <button id="btn-toggle-select" class="text-xs bg-gray-800 px-2.5 py-1.5 rounded-lg font-medium border border-gray-700">Seleziona</button>
            </div>
        </div>
        <div id="gallery-content" class="flex-1 overflow-y-auto p-3"></div>
        <div id="selection-toolbar" class="hidden bg-gray-900 border-t border-gray-800 p-2.5 flex justify-between items-center shrink-0">
            <span id="selected-count-label" class="text-xs text-gray-400">0 sel.</span>
            <div class="flex gap-2">
                <button id="btn-bulk-share" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 disabled:opacity-50" disabled>
                    <i class="fa-solid fa-share-nodes"></i> Condividi
                </button>
                <button id="btn-bulk-delete" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 disabled:opacity-50" disabled>
                    <i class="fa-solid fa-trash"></i> Elimina
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE AZIONE SINGOLA -->
    <div id="single-photo-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-xl max-w-xs w-full p-4 flex flex-col items-center shadow-2xl relative">
            <button id="btn-close-single" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center bg-gray-800 rounded-full text-gray-400 hover:text-white border border-gray-700">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="single-photo-preview" src="" class="w-full max-h-64 object-contain rounded-lg mb-3 border border-gray-800 bg-black mt-4">
            <h3 id="single-photo-title" class="text-sm font-bold text-amber-400 mb-1">Foto</h3>
            <p id="single-photo-info" class="text-[10px] text-gray-300 text-center mb-4 truncate w-full"></p>
            <div class="flex gap-2 w-full">
                <button id="btn-single-share" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs py-2.5 rounded-lg font-semibold flex items-center justify-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-share-nodes"></i> Condividi
                </button>
                <button id="btn-single-delete" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-xs py-2.5 rounded-lg font-semibold flex items-center justify-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-trash"></i> Elimina
                </button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(console.error);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        let stream = null;
        let photos = JSON.parse(localStorage.getItem('gps_photos_pwa_v6') || '[]');
        let photoCounter = parseInt(localStorage.getItem('gps_photos_counter_pwa_v6') || '0');
        let currentGPS = { lat: 0, lon: 0 };
        let isSelectionMode = false;
        let selectedPhotoIds = new Set();
        let currentActivePhotoId = null;

        const videoElem = document.getElementById('camera-feed');
        const canvasElem = document.getElementById('photo-canvas');
        const spLabel = document.getElementById('sp-label');
        const locationLabel = document.getElementById('location-label');
        const overlayAddr = document.getElementById('overlay-addr');
        const categorySelect = document.getElementById('category-select');
        const overlayCategory = document.getElementById('overlay-category');
        const overlayCoords = document.getElementById('overlay-coords');
        const fileUpload = document.getElementById('file-upload');

        async function initCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                videoElem.srcObject = stream;
            } catch (err) {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                videoElem.srcObject = stream;
            }
        }

        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    currentGPS.lat = position.coords.latitude;
                    currentGPS.lon = position.coords.longitude;
                    const coordStr = `Lat: ${currentGPS.lat.toFixed(5)}, Lon: ${currentGPS.lon.toFixed(5)}`;
                    
                    spLabel.textContent = "GPS Connesso";
                    locationLabel.textContent = coordStr;
                    overlayCoords.textContent = coordStr;
                    
                    // Aggiorna il testo dell'attesa non appena riceve un segnale
                    overlayAddr.textContent = "Coordinate acquisite";
                    overlayAddr.classList.remove("text-gray-100");
                    
                }, null, { enableHighAccuracy: true });
            }
        }

        categorySelect.addEventListener('change', () => overlayCategory.textContent = categorySelect.value);

        function drawGPSOverlay(canvas, ctx, callback) {
            const panelH = Math.max(160, canvas.height * 0.18); 
            const panelY = canvas.height - panelH;
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, panelY, canvas.width, panelH);
            ctx.fillStyle = "rgba(255, 152, 0, 0.9)";
            ctx.fillRect(0, panelY, 15, panelH);

            const mapImg = new Image();
            mapImg.crossOrigin = "anonymous"; 
            mapImg.src = `https://staticmap.openstreetmap.de/staticmap.php?center=${currentGPS.lat},${currentGPS.lon}&zoom=16&size=160x160&maptype=mapnik&markers=${currentGPS.lat},${currentGPS.lon},red-pushpin`;

            mapImg.onload = () => finishDrawingMap(mapImg);
            mapImg.onerror = () => finishDrawingMap(null);

            function finishDrawingMap(img) {
                const mapSize = panelH * 0.8; 
                const mapX = 30;
                const mapY = panelY + (panelH - mapSize) / 2;

                if (img) {
                    ctx.drawImage(img, mapX, mapY, mapSize, mapSize);
                    ctx.strokeStyle = "white";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(mapX, mapY, mapSize, mapSize);
                }

                const textX = mapX + mapSize + 25;
                const baseFontSize = Math.max(14, canvas.width * 0.025);
                const now = new Date();
                
                ctx.fillStyle = "white";
                ctx.font = `bold ${baseFontSize * 1.2}px sans-serif`;
                ctx.fillText(`Coordinate Geografiche:`, textX, mapY + (mapSize * 0.25));
                
                ctx.font = `${baseFontSize}px sans-serif`;
                ctx.fillStyle = "#e2e8f0";
                ctx.fillText(`Lat: ${currentGPS.lat.toFixed(6)}`, textX, mapY + (mapSize * 0.50));
                ctx.fillText(`Lon: ${currentGPS.lon.toFixed(6)}`, textX, mapY + (mapSize * 0.70));
                
                ctx.fillStyle = "#fbbf24";
                ctx.font = `bold ${baseFontSize * 0.9}px sans-serif`;
                ctx.fillText(`Data: ${now.toLocaleDateString()} Ora: ${now.toLocaleTimeString()}`, textX, mapY + (mapSize * 0.95));
                
                callback();
            }
        }

        function finalizePhoto(canvas) {
            photoCounter++;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const now = new Date();
            
            photos.unshift({
                id: 'photo_' + Date.now(),
                number: photoCounter,
                category: categorySelect.value,
                dateStr: now.toLocaleDateString(),
                timestamp: now.toISOString(),
                data: dataUrl,
                info: `Lat: ${currentGPS.lat.toFixed(5)}, Lon: ${currentGPS.lon.toFixed(5)} - ${categorySelect.value}`
            });
            
            localStorage.setItem('gps_photos_pwa_v6', JSON.stringify(photos));
            localStorage.setItem('gps_photos_counter_pwa_v6', photoCounter);
            updatePreviewUI();
        }

        document.getElementById('btn-capture').addEventListener('click', () => {
            const canvas = canvasElem;
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            
            videoElem.classList.add('opacity-40');
            setTimeout(() => videoElem.classList.remove('opacity-40'), 150);

            drawGPSOverlay(canvas, ctx, () => finalizePhoto(canvas));
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = canvasElem;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    drawGPSOverlay(canvas, ctx, () => {
                        finalizePhoto(canvas);
                        alert("Foto importata e geolocalizzata con successo!");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function updatePreviewUI() {
            document.getElementById('photo-counter-badge').textContent = photoCounter;
            const thumb = document.getElementById('preview-thumb');
            const placeholder = document.getElementById('preview-placeholder');
            if (photos.length > 0) {
                thumb.src = photos[0].data;
                thumb.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                thumb.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        // Funzione ricalcolo contatore
        function recalculateCounter() {
            if (photos.length === 0) {
                photoCounter = 0;
            } else {
                // Trova il numero di foto più alto tra quelle rimaste
                photoCounter = Math.max(...photos.map(p => p.number));
            }
            localStorage.setItem('gps_photos_counter_pwa_v6', photoCounter);
        }

        document.getElementById('btn-reset-counter').addEventListener('click', () => {
            if (confirm("Azzerare la numerazione delle foto?")) { 
                photoCounter = 0; 
                localStorage.setItem('gps_photos_counter_pwa_v6', 0); 
                updatePreviewUI(); 
            }
        });
        
        document.getElementById('btn-exit').addEventListener('click', () => { 
            if(confirm("Chiudere l'app?")) window.close(); 
        });

        const galleryModal = document.getElementById('gallery-modal');
        document.getElementById('btn-gallery-open').addEventListener('click', () => { 
            renderGallery(); 
            galleryModal.classList.remove('hidden'); 
        });
        
        document.getElementById('btn-close-gallery').addEventListener('click', () => { 
            galleryModal.classList.add('hidden'); 
            isSelectionMode = false; 
            document.getElementById('selection-toolbar').classList.add('hidden');
            document.getElementById('btn-toggle-select').textContent = "Seleziona";
        });
        
        document.getElementById('btn-close-single').addEventListener('click', () => {
            document.getElementById('single-photo-modal').classList.add('hidden')
        });

        // Tasto Elimina Modal Singola
        document.getElementById('btn-single-delete').addEventListener('click', () => {
            if(confirm("Sei sicuro di voler eliminare questa foto?")) {
                // Rimuovi la foto dall'array
                photos = photos.filter(p => p.id !== currentActivePhotoId);
                
                recalculateCounter(); // Ricalcola il contatore
                localStorage.setItem('gps_photos_pwa_v6', JSON.stringify(photos));
                
                document.getElementById('single-photo-modal').classList.add('hidden');
                renderGallery();
                updatePreviewUI();
            }
        });

        // Tasto Condividi Modal Singola
        document.getElementById('btn-single-share').addEventListener('click', async () => {
            const photo = photos.find(p => p.id === currentActivePhotoId);
            if (!photo) return;
            
            if (navigator.share) {
                try {
                    const blob = await (await fetch(photo.data)).blob();
                    const file = new File([blob], `Foto_GPS_${photo.number}.jpg`, { type: 'image/jpeg' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ 
                            files: [file],
                            title: `Foto GPS #${photo.number}`,
                            text: `Categoria: ${photo.category}`
                        });
                        return;
                    }
                } catch (e) {
                    console.error("Condivisione annullata o fallita", e);
                }
            } else {
                alert("Il tuo dispositivo/browser non supporta la condivisione nativa dei file.");
            }
        });

        function renderGallery() {
            const container = document.getElementById('gallery-content');
            container.innerHTML = '';
            document.getElementById('gallery-total-count').textContent = photos.length;
            
            if (photos.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-16"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><br>Nessuna foto salvata</div>`;
                return;
            }

            // Raggruppa foto per data
            const grouped = {};
            photos.forEach(photo => {
                if (!grouped[photo.dateStr]) grouped[photo.dateStr] = [];
                grouped[photo.dateStr].push(photo);
            });

            // Genera la UI della galleria raggruppata
            for (const date in grouped) {
                // Intestazione Data
                const dateHeader = document.createElement('div');
                dateHeader.className = "text-amber-500 font-bold text-xs mt-4 mb-2 border-b border-gray-800 pb-1 sticky top-0 bg-gray-900/90 backdrop-blur z-10 px-1";
                dateHeader.textContent = date;
                container.appendChild(dateHeader);

                // Griglia Foto
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-3 gap-1.5";

                grouped[date].forEach(photo => {
                    const item = document.createElement('div');
                    item.className = `relative aspect-square bg-gray-800 rounded-lg overflow-hidden border-2 ${selectedPhotoIds.has(photo.id) ? 'border-amber-500 scale-95' : 'border-transparent'} transition-all`;
                    item.innerHTML = `
                        <img src="${photo.data}" class="w-full h-full object-cover">
                        <div class="absolute top-1 left-1 bg-black/70 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">#${photo.number}</div>
                    `;
                    
                    item.addEventListener('click', () => {
                        if (isSelectionMode) {
                            selectedPhotoIds.has(photo.id) ? selectedPhotoIds.delete(photo.id) : selectedPhotoIds.add(photo.id);
                            renderGallery();
                        } else {
                            currentActivePhotoId = photo.id;
                            document.getElementById('single-photo-preview').src = photo.data;
                            document.getElementById('single-photo-title').textContent = `Foto #${photo.number}`;
                            document.getElementById('single-photo-info').textContent = photo.info;
                            document.getElementById('single-photo-modal').classList.remove('hidden');
                        }
                    });
                    grid.appendChild(item);
                });
                container.appendChild(grid);
            }
        }

        document.getElementById('btn-toggle-select').addEventListener('click', () => {
            isSelectionMode = !isSelectionMode;
            document.getElementById('btn-toggle-select').textContent = isSelectionMode ? "Annulla" : "Seleziona";
            document.getElementById('selection-toolbar').classList.toggle('hidden', !isSelectionMode);
            if (!isSelectionMode) selectedPhotoIds.clear();
            renderGallery();
        });

        window.onload = () => { initCamera(); initGPS(); updatePreviewUI(); };
    </script>
</body>
</html>
