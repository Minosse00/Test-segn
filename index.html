<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Segnalazioni Rapide</title>
    <style>
        /* CSS INTERNO LEGGERISSIMO - Velocità istantanea senza internet */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #111827; color: #ffffff; padding-bottom: 40px; }
        
        #status-rete { font-size: 11px; font-weight: bold; text-align: center; padding: 5px; }
        .online { background-color: #059669; }
        .offline { background-color: #ea580c; }

        main { max-width: 450px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }

        /* SEZIONE SCATTO CON ANTEPRIMA PICCOLA */
        .area-scatto { display: flex; align-items: center; background-color: #1f2937; padding: 12px; border-radius: 16px; border: 1px solid #374151; gap: 12px; }
        
        .box-miniatura { 
            width: 70px; 
            height: 70px; 
            border: 2px dashed #4b5563; 
            border-radius: 12px; 
            background-color: #030712; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        #camera-input { display: none; }
        .icona-cam { font-size: 24px; }
        #anteprime-scatto-img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .dettagli-scatto { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .titolo-scatto { font-size: 13px; font-weight: bold; color: #9ca3af; }
        .stato-scatto { font-size: 11px; color: #6b7280; font-style: italic; }

        /* PANNELLO COMANDI SOTTO */
        .pannello-comandi { background-color: #1f2937; border-radius: 16px; padding: 16px; border: 1px solid #374151; display: flex; flex-direction: column; gap: 12px; }
        .riga-doppia { display: grid; grid-template-cols: 1fr 1fr; gap: 8px; }
        label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px; font-weight: 500; }
        
        select, input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            background-color: #374151; 
            border: 1px solid #4b5563; 
            border-radius: 10px; 
            color: #ffffff; 
            font-size: 13px; 
            outline: none; 
        }
        .btn-gps { width: 100%; height: 38px; background-color: #2563eb; color: white; border: none; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #gps-status { font-size: 10px; color: #9ca3af; font-family: monospace; text-align: center; background-color: #030712; padding: 5px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn-salva { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 4px; }

        /* ARCHIVIO FOTO SUL DISPOSITIVO */
        .titolo-archivio { font-size: 11px; font-weight: bold; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding-left: 4px; }
        .lista-schede { display: flex; flex-direction: column; gap: 10px; }
        .scheda { background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 12px; }
        .scheda-info { flex-grow: 1; font-size: 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .scheda-titolo { font-weight: bold; color: #f3f4f6; }
        .scheda-gps { font-family: monospace; font-size: 10px; color: #9ca3af; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .scheda-img { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
        .btn-cestino { background-color: #7f1d1d; color: #fca5a5; border: none; padding: 6px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }

        /* MODALE GALLERIA A SCHERMO INTERO */
        .galleria-overlay { display: none; position: fixed; inset: 0; background-color: rgba(3, 7, 18, 0.98); z-index: 999; flex-direction: column; }
        .galleria-header { display: flex; justify-content: space-between; padding: 16px; align-items: center; border-bottom: 1px solid #1f2937; }
        .btn-chiudi { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .galleria-corpo { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; }
        #galleria-immagine-focus { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
        .galleria-footer { padding: 16px; background-color: #111827; border-top: 1px solid #1f2937; display: flex; flex-direction: column; gap: 8px; }
        
        .btn-wa { width: 100%; padding: 12px; background-color: #22c55e; color: #030712; border: none; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer; text-align: center; }
        .btn-share { width: 100%; padding: 10px; background-color: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .info-vuoto { color: #6b7280; font-size: 11px; font-style: italic; text-align: center; padding: 12px 0; }
    </style>
</head>
<body>

    <div id="status-rete" class="online">Connesso a Internet</div>

    <main>
        <!-- ANTEPRIMA PICCOLA IN ALTO -->
        <div class="area-scatto">
            <div class="box-miniatura" id="box-scatto-click" onclick="azioneMiniatura()">
                <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="previewImage(event)">
                <div id="upload-placeholder" class="icona-cam">📸</div>
                <img id="anteprime-scatto-img" alt="Miniatura">
            </div>
            <div class="dettagli-scatto">
                <span class="titolo-scatto" id="testo-stato-foto">Nessuna foto acquisita</span>
                <span class="stato-scatto" id="sotto-testo-foto">Tocca l'icona per scattare</span>
            </div>
        </div>

        <!-- IMPOSTAZIONI E COMPILAZIONE DATI -->
        <div class="pannello-comandi">
            <div class="riga-doppia">
                <div>
                    <label>Tipo Problema</label>
                    <select id="categoria">
                        <option value="🕳️ Buca stradale">🕳️ Buche</option>
                        <option value="🌱 Taglio erba">🌱 Taglio Erba</option>
                        <option value="🛑 Segnaletica">🛑 Segnaletica</option>
                        <option value="⚙️ Altro">⚙️ Altro</option>
                    </select>
                </div>
                <div>
                    <label>Posizione GPS</label>
                    <button type="button" onclick="ottieniPosizione()" class="btn-gps">
                        📍 <span id="gps-btn-text">Rileva GPS</span>
                    </button>
                </div>
            </div>
            
            <p id="gps-status">Nessuna coordinata acquisita</p>

            <div>
                <label>Note / Dettagli strada (opzionale)</label>
                <input type="text" id="note" placeholder="Es. vicino al civico 4...">
            </div>

            <button onclick="salvaSuDispositivo()" class="btn-salva">
                💾 Salva nella memoria del Telefono
            </button>
        </div>

        <!-- STORICO LOCALE IN BASSO -->
        <h2 class="titolo-archivio">Archivio Foto sul Dispositivo</h2>
        <div id="lista-segnalazioni" class="lista-schede"></div>
    </main>

    <!-- SCHERMO INTERO INTERNO (VISUALIZZATORE GALLERIA) -->
    <div id="galleria-overlay" class="galleria-overlay">
        <div class="galleria-header">
            <span id="galleria-titolo-problema" style="font-weight: bold;">Anteprima Segnalazione</span>
            <button onclick="chiudiGalleria()" class="btn-chiudi">✕</button>
        </div>
        <div class="galleria-corpo">
            <img id="galleria-immagine-focus" src="" alt="Galleria Focus">
        </div>
        <div class="galleria-footer">
            <button id="btn-condividi-wa" class="btn-wa">💬 Condividi su WhatsApp</button>
            <button id="btn-condividi-share" class="btn-share">🔗 Invia ad altre App</button>
        </div>
    </div>

    <script>
        let coordinateAttuali = null;
        let fotoBase64 = null;
        let fileCondivisibile = null;
        let segnalazioneSelezionataPerCondivisione = null;

        function aggiornaStatoRete() {
            const bar = document.getElementById('status-rete');
            if (bar) {
                if (navigator.onLine) { bar.innerText = "Connesso a Internet"; bar.className = "online"; }
                else { bar.innerText = "Modalità Offline (Salvataggio locale)"; bar.className = "offline"; }
            }
        }
        window.addEventListener('online', aggiornaStatoRete);
        window.addEventListener('offline', aggiornaStatoRete);

        // Controlla cosa fare quando si clicca sul quadratino in alto
        function azioneMiniatura() {
            if (fotoBase64) {
                // Se la foto è già stata scattata, cliccandoci sopra si apre la galleria interna
                apriGalleria(fotoBase64, document.getElementById('categoria').value, document.getElementById('note').value, coordinateAttuali);
            } else {
                // Se è vuoto, apre la fotocamera
                document.getElementById('camera-input').click();
            }
        }

        function previewImage(event) {
            const files = event.target.files;
