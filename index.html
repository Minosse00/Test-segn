<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segnalazioni Rapide</title>
    <!-- Tailwind CSS Standard CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>#camera-input { display: none; }</style>
</head>
<body class="bg-gray-900 font-sans antialiased pb-10 text-white" onload="ottieniPosizione()">

    <!-- Stato Rete -->
    <div id="status-rete" class="bg-green-600 text-white text-xs font-bold text-center py-1 transition-all">
        Connesso a Internet
    </div>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- AREA FOTOCAMERA -->
        <div class="bg-gray-800 rounded-2xl p-4 shadow-xl border border-gray-700 space-y-4">
            
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-600 rounded-xl overflow-hidden bg-gray-950 cursor-pointer aspect-video relative" onclick="document.getElementById('camera-input').click()">
                <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="previewImage(event)">
                
                <div id="upload-placeholder" class="text-center p-4">
                    <span class="text-5xl block">📸</span>
                    <p class="text-sm text-gray-400 mt-2 font-bold uppercase tracking-wider">Tocca per scattare la foto</p>
                </div>
                <img id="preview" class="hidden absolute inset-0 w-full h-full object-cover" alt="Anteprima">
            </div>

            <!-- Dettagli Segnalazione -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Tipo Problema</label>
                    <select id="categoria" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-xl text-sm outline-none text-white">
                        <option value="🕳️ Buca stradale">🕳️ Buche</option>
                        <option value="🌱 Taglio erba">🌱 Taglio Erba</option>
                        <option value="🛑 Segnaletica">🛑 Segnaletica</option>
                        <option value="⚙️ Altro">⚙️ Altro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Posizione GPS</label>
                    <button type="button" onclick="ottieniPosizione()" class="w-full bg-blue-600 hover:bg-blue-700 p-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                        📍 <span id="gps-btn-text">Aggiorna GPS</span>
                    </button>
                </div>
            </div>
            
            <p id="gps-status" class="text-[11px] text-gray-300 font-mono text-center truncate bg-gray-900 p-2 rounded border border-gray-700">Rilevamento GPS automatico...</p>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Note (opzionale)</label>
                <input type="text" id="note" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-xl text-sm outline-none text-white" placeholder="Es. vicino al civico 4...">
            </div>

            <!-- AZIONI DI CONDIVISIONE / SALVATAGGIO -->
            <div class="space-y-2 pt-2">
                <button onclick="gestisciSalvataggioECondivisione('whatsapp')" class="w-full bg-green-500 text-gray-950 py-3.5 rounded-xl font-black text-center shadow-lg hover:bg-green-400 transition flex items-center justify-center gap-2">
                    💬 Invia Foto su WhatsApp
                </button>
                
                <button onclick="gestisciSalvataggioECondivisione('share')" class="w-full bg-blue-500 text-white py-3 rounded-xl font-bold text-center shadow-md hover:bg-blue-400 transition flex items-center justify-center gap-2 text-sm">
                    🔗 Invia ad altre App (Email, SMS...)
                </button>
            </div>
        </div>

        <!-- STORICO LOCALE -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-gray-400 tracking-wider uppercase">Archivio sul Dispositivo</h2>
                <button onclick="svuotaArchivio()" class="text-xs text-red-400 hover:text-red-300 underline">Elimina Tutti</button>
            </div>
            <div id="lista-segnalazioni" class="space-y-3">
                <!-- Dati dinamici -->
            </div>
        </div>
    </main>

    <script>
        let coordinateAttuali = null;
        let fotoBase64Originale = null;
        let fileCondivisibile = null;

        function aggiornaStatoRete() {
            const bar = document.getElementById('status-rete');
            if (bar) {
                if (navigator.onLine) {
                    bar.innerText = "Connesso a Internet";
                    bar.className = "bg-green-600 text-white text-xs font-bold text-center py-1";
                } else {
                    bar.innerText = "Modalità Offline (Salvataggio locale forzato)";
                    bar.className = "bg-orange-600 text-white text-xs font-bold text-center py-1";
                }
            }
        }
        window.addEventListener('online', aggiornaStatoRete);
        window.addEventListener('offline', aggiornaStatoRete);

        function previewImage(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            fileCondivisibile = files[0];

            const reader = new FileReader();
            reader.onload = function(e) {
                fotoBase64Originale = e.target.result;
                document.getElementById('preview').src = fotoBase64Originale;
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('upload-placeholder').classList.add('hidden');
            }
            reader.readAsDataURL(fileCondivisibile);
        }

        // Rilevamento GPS automatico all'avvio
        function ottieniPosizione() {
            const status = document.getElementById('gps-status');
            const btnText = document.getElementById('gps-btn-text');
            if (!navigator.geolocation) { status.innerText = "GPS non supportato"; return; }
            
            btnText.innerText = "Ricerca...";
            status.innerText = "Rilevamento posizione in corso...";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const now = new Date();
                    const dataOra = `${now.toLocaleDateString('it-IT')} ${now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'})}`;
                    
                    coordinateAttuali = { lat, lng, descrizione: `Località non definita - ${dataOra}` };

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                            headers: { 'User-Agent': 'SegnalazioniRapideApp/1.0' }
                        });
                        const data = await response.json();
                        
                        if (data && data.address) {
                            const addr = data.address;
                            const localita = addr.city || addr.town || addr.village || addr.municipality || addr.county || "Zona rurale";
                            let strada = addr.road || addr.pedestrian || addr.suburb || "";

                            // Riconoscimento e formattazione Strada Provinciale (es. SP 8)
                            let matchSp = strada.match(/(sp\s*\d+|strada provinciale\s*\d+)/i);
                            if (matchSp) {
                                strada = matchSp[0].replace(/strada provinciale/gi, 'SP').toUpperCase();
                            }

                            let infoStrada = strada ? `${strada} - ` : "";
                            coordinateAttuali.descrizione = `${infoStrada}${localita} (${dataOra})`;
                        }
                    } catch (e) {
                        coordinateAttuali.descrizione = `Lat:${lat}, Lng:${lng} - ${dataOra}`;
                    }

                    btnText.innerText = "Rilevato ✓";
                    status.innerText = `📍 ${coordinateAttuali.descrizione}`;
                },
                (error) => {
                    btnText.innerText = "Rileva GPS";
                    status.innerText = "Errore GPS: Attiva la localizzazione.";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // Timbro (Watermark) con Numero, Località, SP, Data e Ora sull'immagine
        function applicaWatermarkImmagine(imgSrc, linea1, linea2, linea3, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const fontSize = Math.max(22, Math.floor(img.width / 24));
                ctx.font = `bold ${fontSize}px Arial`;

                const padding = fontSize * 0.8;
                const boxHeight = fontSize * 4.2 + padding * 2;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, canvas.height - boxHeight, canvas.width, boxHeight);

                // Linea 1 (ID e Categoria)
                ctx.fillStyle = '#FACC15'; // Giallo evidenziato
                ctx.fillText(linea1, padding, canvas.height - boxHeight + fontSize + padding * 0.3);
                
                // Linea 2 (Località e SP)
                ctx.font = `${Math.floor(fontSize * 0.85)}px Arial`;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(linea2, padding, canvas.height - boxHeight + fontSize * 2.3 + padding * 0.3);

                // Linea 3 (Data e Ora)
                ctx.fillStyle = '#9CA3AF'; // Grigio chiaro
                ctx.fillText(linea3, padding, canvas.height - boxHeight + fontSize * 3.4 + padding * 0.3);

                callback(canvas.toDataURL('image/jpeg', 0.9));
            };
            img.src = imgSrc;
        }

        function gestisciSalvataggioECondivisione(canale) {
            if (!fotoBase64Originale) { alert("Scatta prima una foto!"); return; }

            const categoria = document.getElementById('categoria').value;
            const note = document.getElementById('note').value;
            const now = new Date();
            const dataOraAttuale = `${now.toLocaleDateString('it-IT')} ${now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'})}`;
            const luogoInfo = coordinateAttuali ? coordinateAttuali.descrizione : `Posizione non rilevata - ${dataOraAttuale}`;
            
            // Progressivo Unico
            let numeroProgressivo = parseInt(localStorage.getItem('counter_segnalazione') || '0') + 1;
            localStorage.setItem('counter_segnalazione', numeroProgressivo);
            const idFormattato = `#${String(numeroProgressivo).padStart(3, '0')}`;

            const linea1 = `SEGNALAZIONE ${idFormattato} - ${categoria}`;
            const linea2 = `📍 ${luogoInfo}`;
            const linea3 = `📝 Note: ${note || 'Nessuna'}`;

            applicaWatermarkImmagine(fotoBase64Originale, linea1, linea2, linea3, function(fotoWatermarked) {
                const nuovaSegnalazione = {
                    id: Date.now(),
                    progressivo: idFormattato,
                    categoria,
                    note,
                    luogo: luogoInfo,
                    foto: fotoWatermarked,
                    data: dataOraAttuale
                };

                let archivio = JSON.parse(localStorage.getItem('foto_salvate_v3')) || [];
                archivio.unshift(nuovaSegnalazione);
                localStorage.setItem('foto_salvate_v3', JSON.stringify(archivio));
                
                mostraSegnalazioni();

                if (!navigator.onLine) {
                    alert(`Segnalazione ${idFormattato} salvata offline nell'archivio locale.`);
                    resetForm();
                    return;
                }

                // Conversione della foto in file/blob da condividere senza testo descrittivo aggiuntivo
                fetch(fotoWatermarked)
                    .then(res => res.blob())
                    .then(blob => {
                        const fileDaCondividere = new File([blob], `segnalazione_${idFormattato}.jpg`, { type: 'image/jpeg' });

                        if (canale === 'whatsapp') {
                            // Su WhatsApp Web/Mobile apriamo la condivisione file nativa se supportata, altrimenti fallback su share o avviso
                            if (navigator.canShare && navigator.canShare({ files: [fileDaCondividere] })) {
                                navigator.share({ files: [fileDaCondividere] }).catch(() => {});
                            } else {
                                // Fallback: scarica direttamente la foto sul dispositivo se WhatsApp diretto non accetta file via URL
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob);
                                a.download = `segnalazione_${idFormattato}.jpg`;
                                a.click();
                                alert("Foto salvata sul dispositivo. Aprila in WhatsApp per inviarla!");
                            }
                        } 
                        else if (canale === 'share') {
                            if (navigator.share && navigator.canShare({ files: [fileDaCondividere] })) {
                                navigator.share({ files: [fileDaCondividere] }).catch(err => console.log(err));
                            } else {
                                alert("Condivisione file non supportata direttamente da questo browser.");
                            }
                        }
                    });

                resetForm();
            });
        }

        // Condividi elemento dall'archivio (Invia solo la foto)
        function condividiDaArchivio(id) {
            let archivio = JSON.parse(localStorage.getItem('foto_salvate_v3')) || [];
            let item = archivio.find(s => s.id === id);
            if (!item) return;

            fetch(item.foto)
                .then(res => res.blob())
                .then(blob => {
                    const fileDaCondividere = new File([blob], `segnalazione_${item.progressivo}.jpg`, { type: 'image/jpeg' });
                    if (navigator.share && navigator.canShare({ files: [fileDaCondividere] })) {
                        navigator.share({ files: [fileDaCondividere] }).catch(err => console.log(err));
                    } else {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `segnalazione_${item.progressivo}.jpg`;
                        a.click();
                    }
                });
        }

        function eliminaSegnalazione(id) {
            if (!confirm("Vuoi eliminare questa segnalazione?")) return;
            let archivio = JSON.parse(localStorage.getItem('foto_salvate_v3')) || [];
            archivio = archivio.filter(s => s.id !== id);
            localStorage.setItem('foto_salvate_v3', JSON.stringify(archivio));
            mostraSegnalazioni();
        }

        function svuotaArchivio() {
            if (!confirm("Vuoi svuotare tutto l'archivio?")) return;
            localStorage.removeItem('foto_salvate_v3');
            mostraSegnalazioni();
        }

        function resetForm() {
            document.getElementById('note').value = "";
            document.getElementById('preview').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            fotoBase64Originale = null;
        }

        function mostraSegnalazioni() {
            const lista = document.getElementById('lista-segnalazioni');
            if (!lista) return;
            const archivio = JSON.parse(localStorage.getItem('foto_salvate_v3')) || [];
            
            lista.innerHTML = "";
            if (archivio.length === 0) {
                lista.innerHTML = `<p class="text-xs text-gray-500 text-center py-4 bg-gray-800 rounded-xl border border-gray-800">Nessuna segnalazione salvata nell'archivio</p>`;
                return;
            }

            archivio.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-gray-800 p-3 rounded-xl border border-gray-700 space-y-2";
                div.innerHTML = `
                    <div class="flex gap-3 items-center">
                        <img src="${item.foto}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0 border border-gray-600">
                        <div class="text-xs space-y-1 overflow-hidden w-full">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-yellow-400">${item.progressivo} - ${item.categoria}</span>
                                <span class="text-gray-400 text-[10px]">${item.data}</span>
                            </div>
                            <p class="text-blue-300 truncate">📍 ${item.luogo || 'Posizione non specificata'}</p>
                            <p class="text-gray-400 truncate">Note: ${item.note || 'Nessuna'}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 pt-1 border-t border-gray-700/60 justify-end">
                        <button onclick="condividiDaArchivio(${item.id})" class="bg-blue-600/80 hover:bg-blue-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                            📤 Invia Foto
                        </button>
                        <button onclick="eliminaSegnalazione(${item.id})" class="bg-red-600/80 hover:bg-red-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                            🗑️ Elimina
                        </button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        document.addEventListener('DOMContentLoaded', mostraSegnalazioni);
    </script>
</body>
</html>
