<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPS Map Camera SP</title>
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GPS Camera">
    <meta name="theme-color" content="#030712">

    <!-- Icona PWA personalizzata -->
    <link rel="icon" type="image/jpeg" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=">
    <link rel="apple-touch-icon" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=">

    <!-- Web App Manifest incorporato -->
    <script>
        const manifest = {
            "name": "GPS Map Camera SP",
            "short_name": "GPS Camera",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#030712",
            "theme_color": "#030712",
            "icons": [
                {
                    "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=",
                    "sizes": "512x512",
                    "type": "image/jpeg"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: fixed;
            touch-action: pan-y;
        }
        * {
            box-sizing: border-box;
        }
    </style>
</head>
<body class="flex flex-col select-none">

    <!-- HEADER / INFO GPS -->
    <header class="w-full bg-gray-900/95 backdrop-blur-md px-3 py-2 border-b border-gray-800 flex justify-between items-center z-10 shrink-0">
        <div class="overflow-hidden pr-2 flex-1">
            <h1 class="text-xs font-bold tracking-wide text-amber-400 flex items-center gap-1.5 truncate">
                <i class="fa-solid fa-road text-[11px] shrink-0"></i> <span id="sp-label" class="truncate">GPS Attivo</span>
            </h1>
            <p class="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5 truncate">
                <i class="fa-solid fa-location-dot text-red-500 text-[10px] shrink-0"></i> <span id="location-label" class="truncate">Rilevamento coordinate in corso...</span>
            </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-reset-counter" class="bg-gray-800 hover:bg-gray-700 text-amber-400 border border-gray-700 text-[10px] px-2 py-1 rounded-lg font-medium flex items-center gap-1 active:scale-95 transition" title="Resetta contatore">
                <i class="fa-solid fa-rotate-right"></i> Reset #
            </button>
            <div id="offline-badge" class="hidden bg-red-600/20 text-red-400 border border-red-500/35 text-[9px] px-2 py-0.5 rounded-full font-semibold">
                OFFLINE
            </div>
        </div>
    </header>

    <!-- VIEWPORT FOTOCAMERA -->
    <main id="main-viewport" class="relative w-full flex-1 bg-black flex items-center justify-center overflow-hidden">
        <video id="camera-feed" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>

        <div id="refresh-indicator" class="absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-black text-[10px] font-bold px-3 py-1 rounded-full shadow-lg transition-all duration-300 -translate-y-12 opacity-0 z-20 flex items-center gap-1">
            <i class="fa-solid fa-rotate animate-spin"></i> Aggiornamento...
        </div>

        <div class="absolute bottom-3 left-3 right-3 pointer-events-none flex flex-col justify-end z-10">
            <div id="overlay-box" class="bg-black/65 backdrop-blur-md p-2 rounded-lg border border-white/15 max-w-[280px] text-[10px] space-y-0.5 shadow-lg">
                <div class="font-bold text-amber-300 truncate" id="overlay-category">Taglio erba</div>
                <div class="text-gray-100 truncate" id="overlay-addr">Posizione: In attesa...</div>
                <div class="text-gray-300 text-[9px]" id="overlay-coords">Lat: 0.0000, Lon: 0.0000</div>
            </div>
        </div>
    </main>

    <!-- CONTROLLI INFERIORI -->
    <footer class="w-full bg-gray-900 px-4 py-3 flex items-center justify-around border-t border-gray-800 z-10 shrink-0">
        <button id="btn-gallery-open" class="relative w-12 h-12 rounded-xl bg-gray-800 border-2 border-gray-700 overflow-hidden focus:outline-none shadow-lg active:scale-95 transition shrink-0 flex items-center justify-center">
            <img id="preview-thumb" src="" alt="" class="w-full h-full object-cover hidden">
            <div id="preview-placeholder" class="w-full h-full flex items-center justify-center text-gray-400 text-xs">
                <i class="fa-solid fa-images"></i>
            </div>
            <span id="photo-counter-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black text-[9px] font-black px-1.5 py-0.2 rounded-full">0</span>
        </button>

        <button id="btn-capture" class="w-16 h-16 rounded-full border-3 border-white flex items-center justify-center focus:outline-none active:scale-90 transition shadow-xl shrink-0">
            <div class="bg-white rounded-full w-[52px] h-[52px]"></div>
        </button>

        <div class="flex flex-col justify-center bg-gray-800/90 border border-gray-700 px-2.5 py-1.5 rounded-xl shrink-0 w-32 shadow-lg">
            <span class="text-[9px] text-gray-400 font-semibold mb-0.5 flex items-center gap-1">
                <i class="fa-solid fa-tag text-amber-400"></i> Categoria
            </span>
            <select id="category-select" class="w-full bg-gray-900 text-amber-300 text-[11px] font-bold rounded px-1 py-0.5 border border-gray-700 focus:outline-none focus:border-amber-500">
                <option value="Taglio erba" selected>Taglio erba</option>
                <option value="Buche">Buche</option>
                <option value="Segnaletica">Segnaletica</option>
                <option value="Altro">Altro</option>
            </select>
        </div>
    </footer>

    <!-- MODALE GALLERIA -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
        <div class="p-3 bg-gray-900 flex justify-between items-center border-b border-gray-800 shrink-0">
            <div class="flex items-center gap-2">
                <h2 class="font-bold text-sm">Galleria Foto</h2>
                <span id="gallery-total-count" class="text-[10px] bg-gray-800 px-2 py-0.5 rounded-full text-gray-400">0</span>
            </div>
            <div class="flex gap-2">
                <button id="btn-toggle-select" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg font-medium transition">Seleziona</button>
                <button id="btn-close-gallery" class="w-7 h-7 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
        </div>

        <div id="gallery-content" class="flex-1 overflow-y-auto p-3 space-y-4"></div>

        <div id="selection-toolbar" class="hidden bg-gray-900 border-t border-gray-800 p-2.5 flex justify-between items-center shrink-0">
            <span id="selected-count-label" class="text-xs text-gray-400">0 sel.</span>
            <div class="flex gap-2">
                <button id="btn-bulk-share" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition disabled:opacity-50" disabled>
                    <i class="fa-solid fa-share-nodes"></i> Condividi
                </button>
                <button id="btn-bulk-delete" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition disabled:opacity-50" disabled>
                    <i class="fa-solid fa-trash"></i> Elimina
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE AZIONE SINGOLA FOTO -->
    <div id="single-photo-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-xl max-w-xs w-full p-4 flex flex-col items-center shadow-2xl">
            <img id="single-photo-preview" src="" class="w-48 h-48 object-cover rounded-lg mb-3 border border-gray-800">
            <h3 id="single-photo-title" class="text-xs font-bold text-amber-400 mb-1">Foto</h3>
            <p id="single-photo-info" class="text-[10px] text-gray-300 text-center mb-4 truncate w-full"></p>
            <div class="flex gap-2 w-full">
                <button id="btn-single-share" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs py-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-share-nodes"></i> Condividi
                </button>
                <button id="btn-single-delete" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-3 py-2 rounded-lg text-xs font-semibold transition" title="Elimina foto">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
            <button id="btn-close-single" class="mt-3 text-[11px] text-gray-500 hover:text-gray-300">Chiudi</button>
        </div>
    </div>

    <!-- SCRIPT APPLICATIVO -->
    <script>
        // Service Worker ottimizzato per offline condizionale
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => {
                    if (e.request.url.includes('openstreetmap') || e.request.url.includes('tailwindcss') || e.request.url.includes('font-awesome')) return;
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }))).catch(() => {});
        }

        let stream = null;
        let photos = JSON.parse(localStorage.getItem('gps_photos_pwa_v4') || '[]');
        let photoCounter = parseInt(localStorage.getItem('gps_photos_counter_pwa_v4') || '0');
        let isSelectionMode = false;
        let selectedPhotoIds = new Set();
        let currentActivePhotoId = null;
        let currentGPS = { lat: 0, lon: 0, address: "GPS in acquisizione..." };

        const videoElem = document.getElementById('camera-feed');
        const canvasElem = document.getElementById('photo-canvas');
        const spLabel = document.getElementById('sp-label');
        const locationLabel = document.getElementById('location-label');
        const offlineBadge = document.getElementById('offline-badge');
        const categorySelect = document.getElementById('category-select');
        const refreshIndicator = document.getElementById('refresh-indicator');
        const mainViewport = document.getElementById('main-viewport');
        
        const overlayCategory = document.getElementById('overlay-category');
        const overlayAddr = document.getElementById('overlay-addr');
        const overlayCoords = document.getElementById('overlay-coords');

        const previewThumb = document.getElementById('preview-thumb');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const photoCounterBadge = document.getElementById('photo-counter-badge');

        const singlePhotoModal = document.getElementById('single-photo-modal');
        const singlePhotoPreview = document.getElementById('single-photo-preview');
        const singlePhotoTitle = document.getElementById('single-photo-title');
        const singlePhotoInfo = document.getElementById('single-photo-info');

        async function initCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoElem.srcObject = stream;
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    videoElem.srcObject = stream;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera posteriore.");
                }
            }
        }

        // Geolocalizzazione nativa rapida e affidabile
        function initGPS() {
            if (!navigator.geolocation) {
                locationLabel.textContent = "GPS non supportato dal browser";
                return;
            }
            navigator.geolocation.watchPosition((position) => {
                currentGPS.lat = position.coords.latitude;
                currentGPS.lon = position.coords.longitude;
                currentGPS.address = `Lat: ${currentGPS.lat.toFixed(5)}, Lon: ${currentGPS.lon.toFixed(5)}`;
                
                spLabel.textContent = "GPS Connesso";
                locationLabel.textContent = currentGPS.address;
                overlayCoords.textContent = currentGPS.address;
                overlayAddr.textContent = "Posizione rilevata da GPS";
            }, (error) => {
                locationLabel.textContent = "Segnale GPS assente o permessi negati";
                overlayAddr.textContent = "Attivare geolocalizzazione";
            }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
        }

        let startY = 0;
        mainViewport.addEventListener('touchstart', (e) => {
            if (mainViewport.scrollTop === 0) startY = e.touches[0].clientY;
        }, { passive: true });

        mainViewport.addEventListener('touchmove', (e) => {
            if (startY && e.touches[0].clientY - startY > 90) {
                refreshIndicator.classList.remove('-translate-y-12', 'opacity-0');
                initCamera();
                initGPS();
                setTimeout(() => refreshIndicator.classList.add('-translate-y-12', 'opacity-0'), 1200);
                startY = 0;
            }
        }, { passive: true });

        categorySelect.addEventListener('change', () => { overlayCategory.textContent = categorySelect.value; });

        document.getElementById('btn-reset-counter').addEventListener('click', () => {
            if (confirm("Azzerare la numerazione delle foto?")) {
                photoCounter = 0;
                localStorage.setItem('gps_photos_counter_pwa_v4', 0);
                updatePreviewUI();
            }
        });

        window.addEventListener('online', () => offlineBadge.classList.add('hidden'));
        window.addEventListener('offline', () => offlineBadge.classList.remove('hidden'));

        // Scatto foto con miniatura cartina e coordinate GPS
        document.getElementById('btn-capture').addEventListener('click', () => {
            const canvas = canvasElem;
            canvas.width = videoElem.videoWidth || 1280;
            canvas.height = videoElem.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);

            photoCounter++;
            const panelX = 40;
            const panelY = canvas.height - 230;
            const panelW = 420;
            const panelH = 190;

            // Box di sfondo
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(panelX, panelY, panelW, panelH);

            // Miniatura cartina grafica
            const mapX = panelX + 15;
            const mapY = panelY + 15;
            const mapW = 100;
            const mapH = 160;

            ctx.fillStyle = "#1e293b";
            ctx.fillRect(mapX, mapY, mapW, mapH);

            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(mapX, mapY + 40); ctx.lineTo(mapX + mapW, mapY + 40);
            ctx.moveTo(mapX, mapY + 110); ctx.lineTo(mapX + mapW, mapY + 110);
            ctx.moveTo(mapX + 50, mapY); ctx.lineTo(mapX + 50, mapY + mapH);
            ctx.stroke();

            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(mapX + 20, mapY); ctx.lineTo(mapX + 80, mapY + mapH);
            ctx.stroke();

            // Segnapunto rosso GPS
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(mapX + 50, mapY + 80, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            const textX = mapX + mapW + 20;
            
            ctx.fillStyle = "#F59E0B";
            ctx.font = "bold 32px sans-serif";
            ctx.fillText(`#${photoCounter}`, textX, panelY + 45);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`Lat: ${currentGPS.lat.toFixed(4)}`, textX, panelY + 85);
            ctx.fillText(`Lon: ${currentGPS.lon.toFixed(4)}`, textX, panelY + 115);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px sans-serif";
            ctx.fillText(categorySelect.value, textX, panelY + 150);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            const now = new Date();
            const photoObj = {
                id: 'photo_' + Date.now(),
                number: photoCounter,
                category: categorySelect.value,
                dateStr: now.toLocaleDateString(),
                timestamp: now.toISOString(),
                data: dataUrl,
                info: `Foto #${photoCounter} - Lat: ${currentGPS.lat}, Lon: ${currentGPS.lon}`
            };

            photos.unshift(photoObj);
            localStorage.setItem('gps_photos_pwa_v4', JSON.stringify(photos));
            localStorage.setItem('gps_photos_counter_pwa_v4', photoCounter);
            updatePreviewUI();

            videoElem.classList.add('opacity-40');
            setTimeout(() => videoElem.classList.remove('opacity-40'), 150);
        });

        function updatePreviewUI() {
            photoCounterBadge.textContent = photoCounter;
            if (photos.length > 0) {
                previewThumb.src = photos[0].data;
                previewThumb.classList.remove('hidden');
                previewPlaceholder.classList.add('hidden');
            } else {
                previewThumb.classList.add('hidden');
                previewPlaceholder.classList.remove('hidden');
                photoCounter = 0;
                localStorage.setItem('gps_photos_counter_pwa_v4', 0);
                photoCounterBadge.textContent = 0;
            }
        }

        const galleryModal = document.getElementById('gallery-modal');
        document.getElementById('btn-gallery-open').addEventListener('click', () => {
            renderGallery();
            galleryModal.classList.remove('hidden');
        });
        document.getElementById('btn-close-gallery').addEventListener('click', () => {
            galleryModal.classList.add('hidden');
            exitSelectionMode();
        });

        function renderGallery() {
            const container = document.getElementById('gallery-content');
            container.innerHTML = '';
            document.getElementById('gallery-total-count').textContent = photos.length;

            if (photos.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-16"><i class="fa-solid fa-folder-open text-3xl mb-2"></i><p class="text-xs">Nessuna foto salvata</p></div>`;
                return;
            }

            const grouped = {};
            photos.forEach(p => {
                if (!grouped[p.dateStr]) grouped[p.dateStr] = [];
                grouped[p.dateStr].push(p);
            });

            for (const [day, dayPhotos] of Object.entries(grouped)) {
                const daySection = document.createElement('div');
                daySection.innerHTML = `
                    <div class="text-[10px] font-bold text-amber-400 mb-1.5 uppercase tracking-wider sticky top-0 bg-black/95 py-1 backdrop-blur z-10">${day}</div>
                    <div class="grid grid-cols-3 gap-1.5"></div>
                `;
                const grid = daySection.querySelector('.grid');

                dayPhotos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = `relative aspect-square bg-gray-900 rounded-md overflow-hidden border-2 ${selectedPhotoIds.has(photo.id) ? 'border-amber-500' : 'border-transparent'}`;
                    item.innerHTML = `
                        <img src="${photo.data}" class="w-full h-full object-cover">
                        <div class="absolute top-0.5 left-0.5 bg-black/70 text-white text-[9px] font-bold px-1 py-0.5 rounded">#${photo.number}</div>
                        <div class="absolute bottom-0.5 right-0.5 bg-amber-500/90 text-black text-[8px] font-bold px-1 rounded truncate max-w-[80%]">${photo.category}</div>
                        ${isSelectionMode ? `<div class="absolute top-0.5 right-0.5 w-4 h-4 rounded-full border border-white flex items-center justify-center ${selectedPhotoIds.has(photo.id) ? 'bg-amber-500 text-black' : 'bg-black/40'}"><i class="fa-solid fa-check text-[9px] ${selectedPhotoIds.has(photo.id) ? '' : 'hidden'}"></i></div>` : ''}
                    `;
                    
                    item.addEventListener('click', () => {
                        if (isSelectionMode) {
                            if (selectedPhotoIds.has(photo.id)) selectedPhotoIds.delete(photo.id);
                            else selectedPhotoIds.add(photo.id);
                            renderGallery();
                            updateSelectionToolbar();
                        } else {
                            currentActivePhotoId = photo.id;
                            singlePhotoPreview.src = photo.data;
                            singlePhotoTitle.textContent = `Foto #${photo.number} [${photo.category}]`;
                            singlePhotoInfo.textContent = photo.info;
                            singlePhotoModal.classList.remove('hidden');
                        }
                    });
                    grid.appendChild(item);
                });
                container.appendChild(daySection);
            }
        }

        document.getElementById('btn-close-single').addEventListener('click', () => {
            singlePhotoModal.classList.add('hidden');
        });

        document.getElementById('btn-single-share').addEventListener('click', async () => {
            const photo = photos.find(p => p.id === currentActivePhotoId);
            if (!photo) return;
            if (navigator.share) {
                try {
                    const blob = await (await fetch(photo.data)).blob();
                    const file = new File([blob], `Foto_${photo.number}.jpg`, { type: 'image/jpeg' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file] });
                        return;
                    }
                } catch (e) {}
            }
            alert("Condivisione non supportata.");
        });

        document.getElementById('btn-single-delete').addEventListener('click', () => {
            if (confirm("Eliminare questa foto?")) {
                photos = photos.filter(p => p.id !== currentActivePhotoId);
                if (photos.length === 0) {
                    photoCounter = 0;
                    localStorage.setItem('gps_photos_counter_pwa_v4', 0);
                }
                localStorage.setItem('gps_photos_pwa_v4', JSON.stringify(photos));
                singlePhotoModal.classList.add('hidden');
                renderGallery();
                updatePreviewUI();
            }
        });

        const btnToggleSelect = document.getElementById('btn-toggle-select');
        const selectionToolbar = document.getElementById('selection-toolbar');
        const selectedCountLabel = document.getElementById('selected-count-label');
        const btnBulkShare = document.getElementById('btn-bulk-share');
        const btnBulkDelete = document.getElementById('btn-bulk-delete');

        btnToggleSelect.addEventListener('click', () => {
            isSelectionMode = !isSelectionMode;
            if (isSelectionMode) {
                btnToggleSelect.textContent = "Annulla";
                btnToggleSelect.classList.add('bg-amber-500', 'text-black');
                selectionToolbar.classList.remove('hidden');
            } else {
                exitSelectionMode();
            }
            renderGallery();
        });

        function exitSelectionMode() {
            isSelectionMode = false;
            selectedPhotoIds.clear();
            btnToggleSelect.textContent = "Seleziona";
            btnToggleSelect.classList.remove('bg-amber-500', 'text-black');
            selectionToolbar.classList.add('hidden');
            updateSelectionToolbar();
        }

        function updateSelectionToolbar() {
            const count = selectedPhotoIds.size;
            selectedCountLabel.textContent = `${count} sel.`;
            btnBulkShare.disabled = count === 0;
            btnBulkDelete.disabled = count === 0;
        }

        btnBulkDelete.addEventListener('click', () => {
            if (confirm(`Eliminare ${selectedPhotoIds.size} foto selezionate?`)) {
                photos = photos.filter(p => !selectedPhotoIds.has(p.id));
                if (photos.length === 0) {
                    photoCounter = 0;
                    localStorage.setItem('gps_photos_counter_pwa_v4', 0);
                }
                localStorage.setItem('gps_photos_pwa_v4', JSON.stringify(photos));
                exitSelectionMode();
                renderGallery();
                updatePreviewUI();
            }
        });

        btnBulkShare.addEventListener('click', async () => {
            const selectedPhotos = photos.filter(p => selectedPhotoIds.has(p.id));
            if (navigator.share) {
                try {
                    let filesArray = [];
                    for (let p of selectedPhotos) {
                        const blob = await (await fetch(p.data)).blob();
                        filesArray.push(new File([blob], `Foto_${p.number}.jpg`, { type: 'image/jpeg' }));
                    }
                    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                        await navigator.share({ files: filesArray });
                        return;
                    }
                } catch (e) {}
            }
            alert(`Condivisione di ${selectedPhotos.length} foto pronta.`);
        });

        window.addEventListener('load', () => {
            initCamera();
            initGPS();
            if (navigator.onLine) offlineBadge.classList.add('hidden');
            else offlineBadge.classList.remove('hidden');
            updatePreviewUI();
        });
    </script>
</body>
</html>
